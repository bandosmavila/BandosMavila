<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remigio</title>
<style>[hidden] { display: none !important; }
:root {
  --tapete: #16623a;
  --tapete-osc: #0f4a2b;
  --panel: #f4efe4;
  --tinta: #1d1d1d;
  --suave: #6b6b6b;
  --acento: #f2c14e;
  --peligro: #c0392b;
  --ok: #2e7d32;
  --carta: #fffdf6;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--tinta);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--tapete-osc); min-height: 100vh; }
button { font: inherit; cursor: pointer; border: 1px solid #9c8f74; background: #fff8e6; border-radius: 6px; padding: 6px 12px; }
button:hover:not(:disabled) { background: #ffe9a8; }
button:disabled { opacity: .45; cursor: default; }
button.principal { background: var(--acento); border-color: #b38a1d; font-weight: 600; }
select, input { font: inherit; padding: 4px 6px; border-radius: 5px; border: 1px solid #b9ad93; }

#cabecera { display: flex; align-items: center; gap: 20px; padding: 8px 16px; background: #0b3a21; color: #f5f0e0; }
#cabecera h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
#info-partida { flex: 1; font-size: 14px; opacity: .9; }
.botones-cabecera { display: flex; gap: 10px; align-items: center; font-size: 14px; }

#juego { display: grid; grid-template-columns: 1fr 340px; min-height: calc(100vh - 48px); }
#tapete { background: radial-gradient(ellipse at center, #1c7a47 0%, var(--tapete) 55%, var(--tapete-osc) 100%); padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }
#lateral { background: var(--panel); padding: 12px 14px; overflow-y: auto; max-height: calc(100vh - 48px); }
#lateral h2 { font-size: 15px; margin: 6px 0 8px; text-transform: uppercase; letter-spacing: .6px; color: #5a4d33; }

/* Asientos */
#asientos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.asiento { background: rgba(0,0,0,.28); color: #f3efe2; border-radius: 10px; padding: 8px 10px; border: 2px solid transparent; min-height: 86px; position: relative; }
.asiento.turno { border-color: var(--acento); box-shadow: 0 0 14px rgba(242,193,78,.5); }
.asiento.eliminado { opacity: .35; }
.asiento .nombre { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.asiento .estilo { font-size: 12px; opacity: .8; }
.asiento .fila { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
.asiento .luz { width: 10px; height: 10px; border-radius: 50%; background: #7a7a7a; display: inline-block; }
.asiento.turno .luz { background: #5dff7a; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.18); }
.chip.abierto { background: #2e7d32; }
.chip.repartidor { background: #8e44ad; }
.chip.humano { background: #1f5f99; }
.mini-reverso { width: 16px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(45deg, #2456a6 0 3px, #3a6fc4 3px 6px); border: 1px solid #fff; display: inline-block; }
.puntos-reeng { letter-spacing: 1px; font-size: 12px; }

/* Mesa */
#mesa { flex: 1; min-height: 180px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px 14px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.12); overflow-y: auto; }
#mesa .vacia { color: rgba(255,255,255,.55); margin: auto; }
.comb { display: flex; padding: 6px 8px 4px; border-radius: 8px; background: rgba(255,255,255,.07); border: 2px solid transparent; position: relative; }
.comb .dueño { position: absolute; top: -9px; left: 8px; font-size: 10px; color: #fff; background: rgba(0,0,0,.45); padding: 0 5px; border-radius: 6px; }
.comb .carta + .carta { margin-left: -22px; }
.comb.nueva { border-color: rgba(242,193,78,.8); background: rgba(242,193,78,.12); }
.comb.objetivo { cursor: pointer; }
.comb.objetivo:hover { border-color: #fff; background: rgba(255,255,255,.2); }

/* Centro */
#centro { display: flex; align-items: center; gap: 18px; justify-content: center; }
.monton { position: relative; }
.monton .cuenta { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; color: #e6f2e9; font-size: 12px; }
.monton.activo { cursor: pointer; }
.monton.activo .carta { box-shadow: 0 0 0 3px var(--acento), 0 4px 10px rgba(0,0,0,.4); }
.monton .hueco { width: 84px; height: 120px; border: 2px dashed rgba(255,255,255,.35); border-radius: 8px; }
#acciones { display: flex; flex-direction: column; gap: 6px; min-width: 300px; max-width: 420px; }
#acciones .estado { color: #fff; font-size: 14px; background: rgba(0,0,0,.25); padding: 6px 10px; border-radius: 6px; }
#acciones .estado b { color: var(--acento); }
#acciones .botones { display: flex; flex-wrap: wrap; gap: 6px; }

#eleccion { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--panel); padding: 14px 18px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 5; display: flex; gap: 8px; align-items: center; }

/* Mano */
#zona-mano { background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px 10px 12px; }
#titulo-mano { color: #f3efe2; font-size: 14px; margin-bottom: 6px; display: flex; gap: 12px; align-items: center; }
#titulo-mano .ordenar { margin-left: auto; display: flex; gap: 6px; }
#titulo-mano .ordenar button { padding: 2px 8px; font-size: 12px; }
#mano { display: flex; flex-wrap: nowrap; gap: 18px; min-height: 160px; padding-top: 8px; align-items: flex-end; overflow-x: auto; }
.grupo { display: flex; padding: 22px 8px 8px; border-radius: 10px; background: rgba(255,255,255,.07); position: relative; flex: none; border: 2px solid transparent; }
.grupo .carta + .carta { margin-left: -20px; }
.grupo.destino, .grupo-nuevo.destino { border-color: var(--acento); background: rgba(242,193,78,.15); }
.grupo .etiqueta { position: absolute; top: 3px; left: 8px; font-size: 11px; background: #2e7d32; color: #fff; padding: 1px 7px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.grupo .etiqueta.mala { background: #8a6d1d; }
.grupo-nuevo { flex: none; width: 96px; height: 132px; border: 2px dashed rgba(255,255,255,.35); border-radius: 10px; color: rgba(255,255,255,.6); font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; }
#mano .carta.arrastrando { opacity: .35; }
#mano .carta.soltar-antes { box-shadow: -5px 0 0 var(--acento), 0 2px 5px rgba(0,0,0,.35); }
#mano .carta.soltar-despues { box-shadow: 5px 0 0 var(--acento), 0 2px 5px rgba(0,0,0,.35); }
#mano .carta { cursor: pointer; transition: transform .12s; }
#mano .carta:hover { transform: translateY(-4px); }
#mano .carta.sel { transform: translateY(-14px); box-shadow: 0 0 0 3px var(--acento), 0 6px 14px rgba(0,0,0,.45); }
#mano .carta.nueva-robada { outline: 3px dashed #7fe3ff; outline-offset: 2px; }

/* Cartas */
.carta { position: relative; background: var(--carta); border-radius: 8px; border: 1px solid #bdb39c; box-shadow: 0 2px 5px rgba(0,0,0,.35); color: var(--palo, #333); user-select: none; flex: none; }
.carta-grande { width: 84px; height: 120px; }
.carta-mesa { width: 50px; height: 72px; border-radius: 6px; }
.carta-mini { width: 34px; height: 48px; border-radius: 4px; }
.carta .esq { position: absolute; top: 4px; left: 5px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.carta-grande .esq b { font-size: 20px; }
.carta-mesa .esq b { font-size: 14px; }
.carta-mini .esq { top: 2px; left: 3px; }
.carta-mini .esq b { font-size: 11px; }
.carta-mini .esq svg { display: none; }
.carta-mini .centro svg { width: 16px; height: 16px; }
.carta .centro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.carta-grande .centro { padding-top: 12px; }
.carta-mesa .centro { padding-top: 14px; }
.carta-mini .centro { padding-top: 12px; }
.carta .centro.figura b { font-size: 28px; line-height: 1; font-family: Georgia, serif; }
.carta-mesa .centro.figura b { font-size: 16px; }
.carta-mini .centro.figura b { display: none; }
.carta.comodin { color: #7b2cbf; background: linear-gradient(160deg, #fff 0%, #f1e6ff 100%); }
.carta.comodin .esq { font-size: 18px; }
.carta.comodin .centro { font-size: 38px; }
.carta-mesa.comodin .centro { font-size: 22px; }
.carta-mini.comodin .centro { font-size: 16px; }
.carta.comodin .pie { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .5px; }
.carta-mesa.comodin .pie, .carta-mini.comodin .pie { display: none; }
.carta .repr { position: absolute; bottom: -15px; left: -4px; right: -4px; text-align: center; font-size: 10px; color: #fff; background: #7b2cbf; border-radius: 5px; white-space: nowrap; z-index: 2; }
.carta.reverso { background: repeating-linear-gradient(45deg, #2456a6 0 5px, #3a6fc4 5px 10px); border: 3px solid #fff; }

/* Marcador */
#marcador table { width: 100%; border-collapse: collapse; font-size: 13px; }
#marcador th { text-align: left; font-weight: 600; color: #5a4d33; border-bottom: 1px solid #cfc3a6; padding: 3px 4px; }
#marcador td { padding: 4px; border-bottom: 1px solid #e3d9c2; }
#marcador tr.turno td { background: #fff1c7; }
#marcador tr.eliminado td { color: #aaa; text-decoration: line-through; }
#marcador .bote { margin-top: 8px; font-size: 15px; }
#registro { font-size: 13px; padding-left: 20px; margin: 0; }
#registro li { margin: 2px 0; }
#registro li.destacado { font-weight: 700; }

/* Cubierta y aviso */
#cubierta { position: fixed; inset: 0; background: rgba(8,40,22,.96); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 20; font-size: 22px; }
#aviso { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #3b1f1f; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: 80vw; }
#aviso.info { background: #1f3b2b; }

/* Diálogos */
dialog { border: none; border-radius: 12px; padding: 20px 24px; background: var(--panel); max-width: min(1100px, 95vw); max-height: 90vh; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog h2 { margin-top: 0; }
.config-asientos { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 12px; align-items: center; margin: 12px 0; }
.config-asientos .desc { font-size: 12px; color: var(--suave); }
.config-opciones { display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0; }
.error { color: var(--peligro); font-weight: 600; min-height: 1.2em; }
.fin-tabla { border-collapse: collapse; width: 100%; font-size: 14px; }
.fin-tabla td, .fin-tabla th { padding: 6px 8px; border-bottom: 1px solid #d8ccb0; vertical-align: middle; text-align: left; }
.fin-tabla .cartas { display: flex; flex-wrap: wrap; gap: 3px; }
.fin-tabla tr.pierde td { background: #fbe3df; }
.fin-tabla tr.cierra td { background: #e3f3e4; }
.est-tabla { border-collapse: collapse; font-size: 13px; }
.est-tabla th, .est-tabla td { padding: 5px 8px; border-bottom: 1px solid #d8ccb0; text-align: right; }
.est-tabla th:first-child, .est-tabla td:first-child { text-align: left; }
.dlg-botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.titular { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
</style>
</head>
<body>
<header id="cabecera">
  <h1>Remigio</h1>
  <div id="info-partida"></div>
  <div class="botones-cabecera">
    <label>Velocidad bots
      <select id="velocidad">
        <option value="1400">Lenta</option>
        <option value="700" selected>Normal</option>
        <option value="250">Rápida</option>
      </select>
    </label>
    <button id="btn-estadisticas">Estadísticas</button>
    <button id="btn-nueva">Nueva partida</button>
  </div>
</header>

<main id="juego">
  <section id="tapete">
    <div id="asientos"></div>
    <div id="mesa"><p class="vacia">Todavía no hay nada en la mesa.</p></div>
    <div id="centro">
      <div id="mazo" class="monton" title="Robar del mazo"></div>
      <div id="pozo" class="monton" title="Coger del pozo"></div>
      <div id="acciones"></div>
    </div>
    <div id="eleccion" hidden></div>
    <div id="zona-mano">
      <div id="titulo-mano"></div>
      <div id="mano"></div>
    </div>
  </section>
  <aside id="lateral">
    <h2>Marcador</h2>
    <div id="marcador"></div>
    <h2>Lo que va pasando</h2>
    <ol id="registro"></ol>
  </aside>
</main>

<div id="cubierta" hidden></div>
<div id="aviso" hidden></div>
<dialog id="dlg-config"></dialog>
<dialog id="dlg-fin"></dialog>
<dialog id="dlg-estadisticas"></dialog>

    </span>`;
    tit.querySelectorAll("[data-o]").forEach((b) => {
      b.onclick = () => {
        S.orden = b.dataset.o;
        S.grupos.set(S.vista, grupos.map((gr) => ordenarCartas(gr.map((id) => reales.get(id))).map((c) => c.id)));
        render();
      };
    });
    $("#btn-apartar").onclick = () => {
      const ids = grupos.flat().filter((id) => S.seleccion.includes(id));
      moverCartas(ids, null);
      S.seleccion = [];
      render();
    };
    $("#btn-juntar").onclick = () => {
      S.grupos.set(S.vista, [grupos.flat()]);
      render();
    };
    const puedeElegir = true;
    const limpiarMarcas = () => cont.querySelectorAll(".soltar-antes,.soltar-despues,.destino").forEach((x) => x.classList.remove("soltar-antes", "soltar-despues", "destino"));
    const idsArrastrados = (id) => S.seleccion.includes(id) && S.seleccion.length > 1 ? grupos.flat().filter((x) => S.seleccion.includes(x)) : [id];
    grupos.forEach((gr, gi) => {
      const cartas = gr.map((id) => visibles.get(id)).filter(Boolean);
      if (!cartas.length) return;
      const div = document.createElement("div");
      div.className = "grupo";
      const et = etiquetaGrupo(cartas);
      if (et) {
        const b = document.createElement("span");
        b.className = `etiqueta${et.ok ? "" : " mala"}`;
        b.textContent = et.texto;
        b.title = "Pulsa para seleccionar este grupo";
        b.onclick = () => {
          S.seleccion = cartas.map((c) => c.id);
          render();
        };
        div.appendChild(b);
      }
      div.addEventListener("dragover", (ev) => {
        ev.preventDefault();
        div.classList.add("destino");
      });
      div.addEventListener("dragleave", () => div.classList.remove("destino"));
      div.addEventListener("drop", (ev) => {
        ev.preventDefault();
        if (S.arrastre == null) return;
        moverCartas(idsArrastrados(S.arrastre), gi, gr.length);
        S.arrastre = null;
        render();
      });
      for (const c of cartas) {
        const el = elCarta(c);
        el.draggable = true;
        if (S.seleccion.includes(c.id)) el.classList.add("sel");
        if ((c.id === S.robadaId || recuperados.includes(c)) && turnoPropio) el.classList.add("nueva-robada");
        if (recuperados.includes(c)) el.title = "Comodín recuperado de la mesa: tienes que bajarlo en este turno";
        if (puedeElegir) {
          el.onclick = () => {
            const i = S.seleccion.indexOf(c.id);
            if (i >= 0) S.seleccion.splice(i, 1);
            else S.seleccion.push(c.id);
            render();
          };
        }
        el.addEventListener("dragstart", (ev) => {
          S.arrastre = c.id;
          ev.dataTransfer.effectAllowed = "move";
          ev.dataTransfer.setData("text/plain", String(c.id));
          for (const id of idsArrastrados(c.id)) cont.querySelector(`.carta[data-id="${id}"]`)?.classList.add("arrastrando");
          $("#mano").classList.add("arrastrando-mano");
        });
        el.addEventListener("dragend", () => {
          S.arrastre = null;
          $("#mano").classList.remove("arrastrando-mano");
          render();
        });
        el.addEventListener("dragover", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          limpiarMarcas();
          const r = el.getBoundingClientRect();
          el.classList.add(ev.clientX < r.left + r.width / 2 ? "soltar-antes" : "soltar-despues");
        });
        el.addEventListener("drop", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          if (S.arrastre == null) return;
          const r = el.getBoundingClientRect();
          const despues = ev.clientX >= r.left + r.width / 2;
          const ids = idsArrastrados(S.arrastre);
          if (ids.includes(c.id)) {
            S.arrastre = null;
            render();
            return;
          }
          moverCartas(ids, gi, gr.indexOf(c.id) + (despues ? 1 : 0));
          S.arrastre = null;
          render();
        });
        div.appendChild(el);
      }
      cont.appendChild(div);
    });
    const nuevo = document.createElement("div");
    nuevo.className = "grupo-nuevo";
    nuevo.textContent = "Arrastra aquí para apartar";
    nuevo.addEventListener("dragover", (ev) => {
      ev.preventDefault();
      nuevo.classList.add("destino");
    });
    nuevo.addEventListener("dragleave", () => nuevo.classList.remove("destino"));
    nuevo.addEventListener("drop", (ev) => {
      ev.preventDefault();
      if (S.arrastre == null) return;
      moverCartas(idsArrastrados(S.arrastre), null);
      S.arrastre = null;
      render();
    });
    cont.appendChild(nuevo);
  }
  function renderMarcador() {
    const p = P();
    const ult = p.manos.at(-1);
    $("#marcador").innerHTML = `<table>
    <tr><th>Jugador</th><th>Reeng.</th><th>Pagado</th><th>Últ. mano</th></tr>
    ${S.jugadores.map((j, a) => `<tr class="${!p.activos.includes(a) ? "eliminado" : ""} ${!p.mano.resultado && p.asientoEnTurno === a ? "turno" : ""}">
      <td>${j.nombre}</td><td>${p.reenganches[a]}/${p.maxReenganches}</td><td>${p.aportado[a]}</td>
      <td>${ult && ult.puntos[a] != null ? `${ult.puntos[a]}${ult.perdedores.includes(a) ? " ✗" : ""}` : "—"}</td></tr>`).join("")}
  </table><div class="bote">Bote: <b>${p.bote}</b></div>`;
  }
  function renderRegistro() {
    $("#registro").innerHTML = S.registro.slice(0, 60).map((r) => `<li class="${r.destacado ? "destacado" : ""}">${r.texto}</li>`).join("");
  }
  function mostrarEstadisticas() {
    const d = cargar();
    const dlg = $("#dlg-estadisticas");
    const filas = Object.entries(d).sort((x, y) => y[1].neto - x[1].neto).map(([k, e]) => {
      const n = k.startsWith("h:") ? k.slice(2) : `${perfilPorId(k.slice(2))?.nombre ?? k.slice(2)} (bot)`;
      return `<tr><td>${n}</td><td>${e.partidas}</td><td>${e.ganadas}</td><td>${e.partidas ? Math.round(100 * e.ganadas / e.partidas) : 0}%</td>
      <td><b>${e.neto > 0 ? "+" : ""}${e.neto}</b></td><td>${e.manos}</td><td>${e.cierres}</td><td>${e.manosPerdidas}</td>
      <td>${e.secosHechos}</td><td>${e.secosSufridos}</td><td>${e.reenganches}</td><td>${e.eliminaciones}</td><td>${e.remis}</td></tr>`;
    }).join("");
    dlg.innerHTML = `<h2>Estadísticas</h2>
    ${filas ? `<table class="est-tabla"><tr><th>Jugador</th><th>Partidas</th><th>Ganadas</th><th>%</th><th>Dinero</th><th>Manos</th><th>Cierres</th>
      <th>Manos perdidas</th><th>Secos hechos</th><th>Secos sufridos</th><th>Reenganches</th><th>Eliminado</th><th>Remis</th></tr>${filas}</table>` : "<p>Todavía no hay estadísticas. Se guardan en este navegador al terminar cada mano.</p>"}
    <div class="dlg-botones"><button id="est-borrar">Borrar estadísticas</button><button class="principal" id="est-cerrar">Cerrar</button></div>`;
    $("#est-cerrar").onclick = () => dlg.close();
    $("#est-borrar").onclick = (ev) => {
      if (ev.target.dataset.confirmar) {
        borrar();
        dlg.close();
        aviso("Estadísticas borradas.", "info");
        return;
      }
      ev.target.dataset.confirmar = "1";
      ev.target.textContent = "¿Seguro? Pulsa otra vez";
    };
    dlg.showModal();
  }
  $("#btn-nueva").onclick = mostrarConfig;
  $("#btn-estadisticas").onclick = mostrarEstadisticas;
  $("#dlg-fin").addEventListener("cancel", (e) => e.preventDefault());
  S.config = cargarConfig();
  mostrarConfig();
})();
</script>
</body>
</html>
