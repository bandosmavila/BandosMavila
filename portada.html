<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portada (PRUEBA) - BandosMávila</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1a6b3c;
    --verde-claro: #2d9e5f;
    --crema: #f5f0e8;
    --tinta: #1a1a1a;
    --gris: #6b6b6b;
    --dorado: #c9a227;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 50% 30%, #1e7a45, var(--verde) 70%);
    color: white;
  }
  .aviso-prueba {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: #c0392b; color: white; text-align: center;
    font-size: 11px; padding: 4px; letter-spacing: 1px;
  }
  .portada {
    height: 100%; width: 100%; position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px 20px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; letter-spacing: 2px; text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .musica-linea {
    display: flex; align-items: center; gap: 10px;
    margin-top: 8px; font-size: 13px; opacity: 0.9;
  }
  .btn-play {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5);
    color: white; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-play:active { transform: scale(0.92); }

  .orla {
    position: relative;
    flex: 1; width: min(94vw, 780px); max-width: 92vh;
    aspect-ratio: 1 / 1;
    margin: 6px auto 0;
  }

  /* --- Globo, tal como en el Pódium: cuerpo, ojos, manos --- */
  .globo-wrap {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
  }
  .globo {
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .globo::after {
    content: ''; position: absolute; bottom: -8px; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 10px; background: rgba(255,255,255,0.5);
  }
  .globo-ojos { display: flex; z-index: 2; }
  .globo-ojos span { background: var(--tinta); border-radius: 50%; display: block; }
  .globo-mano {
    position: absolute; background: inherit; border-radius: 4px; z-index: 1;
  }
  .globo-mano-izq { left: -18%; }
  .globo-mano-der { right: -18%; }
  .globo-nombre {
    position: relative; z-index: 2;
    font-weight: 700; text-align: center; line-height: 1;
    color: white;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px  1px 0 #000, 1px  1px 0 #000,
       0px  0px 4px rgba(0,0,0,0.6);
  }

  .entrar {
    position: absolute; bottom: 14px; right: 18px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 30px; padding: 8px 16px;
    font-size: 13px; letter-spacing: 0.5px;
    cursor: pointer; color: white;
  }

  .firma-wrap { text-align: center; margin-bottom: 6px; }
  .firma { font-family: 'Dancing Script', cursive; font-size: 20px; opacity: 0.75; }
  .rubrica { width: 70px; height: 14px; margin: 2px auto 0; opacity: 0.55; }
</style>
</head>
<body>

<div class="aviso-prueba">VERSIÓN DE PRUEBA — no enlazada desde la web real</div>

<div class="portada">
  <h1>PEÑA BANDOSMÁVILA</h1>
  <div class="musica-linea">
    <button class="btn-play" id="btnPlay" onclick="toggleMusica()">▶</button>
    <span>Música: <span id="autorMusica">Pendiente</span></span>
  </div>

  <div class="orla" id="orla"></div>

  <div class="firma-wrap">
    <div class="firma">Claude</div>
    <svg class="rubrica" viewBox="0 0 100 20"><path d="M2 15 C 20 2, 35 18, 50 8 S 80 2, 98 12" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
  </div>

  <div class="entrar" onclick="window.location.href='index.html'">Entrar <span>→</span></div>
</div>

<audio id="audioMusica" src="musica-temporal.mp3" loop></audio>

<script>
const SHEET_ID = '1Gcbt0ND0K1fmBdqwf55DuoGKakrZR9s7eP2r0RIG9hY';
const API_KEY = 'AIzaSyA6zHLUiBURBem0lVORI8X1y-ovSGg2UXs';

// Colores de globo por equipo (Barça=grana/azul, Madrid=blanco liso, Atleti=rojiblanco, Las Palmas=amarillo/azul)
const EQUIPOS = {
  'ADOLFO': 'atletico', 'AGUS': 'atletico', 'MICHEL': 'atletico',
  'MANOLO': 'barcelona', 'NESTOR': 'barcelona', 'CACHO': 'barcelona', 'LOLO': 'barcelona', 'LUISFER': 'barcelona',
  'JULIO': 'madrid', 'JAVI': 'madrid', 'CHUCHI': 'madrid', 'BOZO': 'madrid', 'FIDE': 'madrid',
  'JOSE': 'laspalmas'
};
const ESTILO_EQUIPO = {
  atletico:   'linear-gradient(180deg, #c0392b 0%, #c0392b 50%, #ffffff 50%, #ffffff 100%)',
  barcelona:  'repeating-linear-gradient(90deg, #a50044 0px, #a50044 18%, #004d98 18%, #004d98 36%)',
  madrid:     '#f4f4f4',
  laspalmas:  'repeating-linear-gradient(90deg, #ffd500 0px, #ffd500 18%, #1a1a2e 18%, #1a1a2e 36%)',
};

async function leerHoja(nombre) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nombre}?key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.values || [];
}

function toggleMusica() {
  const audio = document.getElementById('audioMusica');
  const btn = document.getElementById('btnPlay');
  if (audio.paused) {
    audio.play().catch(() => alert('Falta subir musica-temporal.mp3 al repositorio, o el navegador ha bloqueado el sonido.'));
    btn.textContent = '❚❚';
  } else {
    audio.pause();
    btn.textContent = '▶';
  }
}

function crearGlobo(nombre, tam) {
  const equipo = EQUIPOS[nombre] || 'madrid';
  const fondo = ESTILO_EQUIPO[equipo];

  const wrap = document.createElement('div');
  wrap.className = 'globo-wrap';

  const globo = document.createElement('div');
  globo.className = 'globo';
  globo.style.width = tam + 'px';
  globo.style.height = (tam * 1.15) + 'px';
  globo.style.background = fondo;

  const ojos = document.createElement('div');
  ojos.className = 'globo-ojos';
  ojos.style.gap = (tam * 0.16) + 'px';
  ojos.style.marginTop = -(tam * 0.12) + 'px';
  for (let i = 0; i < 2; i++) {
    const ojo = document.createElement('span');
    ojo.style.width = ojo.style.height = (tam * 0.10) + 'px';
    ojos.appendChild(ojo);
  }

  const manoIzq = document.createElement('div');
  manoIzq.className = 'globo-mano globo-mano-izq';
  manoIzq.style.width = (tam * 0.26) + 'px';
  manoIzq.style.height = (tam * 0.11) + 'px';
  manoIzq.style.top = (tam * 0.48) + 'px';

  const manoDer = document.createElement('div');
  manoDer.className = 'globo-mano globo-mano-der';
  manoDer.style.width = (tam * 0.26) + 'px';
  manoDer.style.height = (tam * 0.11) + 'px';
  manoDer.style.top = (tam * 0.48) + 'px';

  const nombreEl = document.createElement('div');
  nombreEl.className = 'globo-nombre';
  nombreEl.style.fontSize = (tam * 0.20) + 'px';
  nombreEl.style.marginTop = (tam * 0.10) + 'px';
  nombreEl.textContent = nombre.substring(0, 6);

  globo.appendChild(ojos);
  globo.appendChild(manoIzq);
  globo.appendChild(manoDer);
  globo.appendChild(nombreEl);
  wrap.appendChild(globo);
  return wrap;
}

function colocarOrla(nombresOrdenados) {
  const orla = document.getElementById('orla');
  const w = orla.clientWidth, h = orla.clientHeight;
  const cx = w / 2, cy = h / 2;

  const anillos = [
    { radio: 0,               gente: nombresOrdenados.slice(0, 1), tam: w * 0.26 },
    { radio: Math.min(w,h)*0.30, gente: nombresOrdenados.slice(1, 5), tam: w * 0.20 },
    { radio: Math.min(w,h)*0.46, gente: nombresOrdenados.slice(5),    tam: w * 0.155 },
  ];

  anillos.forEach((anillo, ai) => {
    const n = anillo.gente.length;
    anillo.gente.forEach((nombre, i) => {
      const angulo = (ai === 0) ? 0 : (Math.PI * 2 * i / n) - Math.PI / 2 + (ai === 2 ? 0.3 : 0);
      const x = cx + anillo.radio * Math.cos(angulo);
      const y = cy + anillo.radio * Math.sin(angulo) * 0.85;

      const globo = crearGlobo(nombre, anillo.tam);
      globo.style.left = x + 'px';
      globo.style.top = y + 'px';
      orla.appendChild(globo);
    });
  });
}

async function init() {
  try {
    const clasifRows = await leerHoja('Clasificacion');
    const clasif = clasifRows.slice(1).filter(r => r[1]);
    const nombresOrdenados = clasif.map(r => String(r[1]).trim().toUpperCase());
    colocarOrla(nombresOrdenados);
  } catch (e) {
    document.getElementById('orla').innerHTML = `<div style="text-align:center; padding-top:40px; opacity:0.8;">Error cargando Clasificación: ${e}</div>`;
  }
}
init();
</script>
</body>
</html>
