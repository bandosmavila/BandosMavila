<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - BandosMávila</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" type="image/png" sizes="192x192" href="admin-icon-192.png">
<link rel="manifest" href="admin-manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1a6b3c;
    --verde-claro: #2d9e5f;
    --crema: #f5f0e8;
    --tinta: #1a1a1a;
    --gris: #6b6b6b;
    --borde: #ddd8cc;
    --rojo: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--crema); color: var(--tinta); padding: 16px; }
  .header { background: var(--tinta); color: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px; max-width: 600px; margin-left: auto; margin-right: auto; }
  .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .card { background: white; border-radius: 12px; border: 1px solid var(--borde); margin-bottom: 16px; overflow: hidden; max-width: 600px; margin-left: auto; margin-right: auto; }
  .card-header { background: var(--verde); color: white; padding: 12px 16px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.5px; }
  .card-body { padding: 12px 16px; }
  .partido { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0ede6; font-size: 14px; }
  .partido:last-child { border-bottom: none; }
  .partido-num { color: var(--gris); font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-right: 8px; }
  .jugador-fila { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0ede6; font-size: 14px; }
  .jugador-fila:last-child { border-bottom: none; }
  .estado-ok { color: var(--verde); font-weight: 700; }
  .estado-pendiente { color: var(--rojo); font-weight: 700; }
  .loading, .aviso { text-align: center; padding: 30px; color: var(--gris); }
  .cierre-info { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--gris); margin-top: 4px; }
  .perlas { display:flex; align-items:center; gap:4px; overflow-x:auto; padding:4px 0; }
  .perla { width:16px; height:16px; border-radius:50%; flex-shrink:0; }
  .perla-actual { width:26px; height:26px; border:2px solid; display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .perla-hilo { width:10px; height:2px; background:var(--borde); flex-shrink:0; }
  .perla-pendiente { background:#d3d1c7; }
  .perla-actual-color { background:#EF9F27; border-color:#854F0B; }
  .perla-hecho { background:var(--verde-claro); }
  .perla-incumplido { background:var(--rojo); }
  .perla-etiqueta { font-size:10px; color:var(--gris); white-space:nowrap; margin-top:2px; }
</style>
</head>
<body>

<div class="header">
  <h1>ADMIN — BandosMávila</h1>
  <p id="subtitulo">Cargando...</p>
</div>

<div id="contenido">
  <div class="loading">Comprobando acceso...</div>
</div>

<script>
const SHEET_ID = '1Gcbt0ND0K1fmBdqwf55DuoGKakrZR9s7eP2r0RIG9hY'; // el mismo que en index.html
const API_KEY = 'AIzaSyA6zHLUiBURBem0lVORI8X1y-ovSGg2UXs'; // el mismo que en index.html
const CLAVE_ADMIN = 'Ad0lf013'; // la misma CLAVE que en index.html/pronosticos.html

async function leerHoja(nombre) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nombre}?key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.values || [];
}

async function leerHojaSerial(nombre) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nombre}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`;
  const res = await fetch(url);
  const data = await res.json();
  return data.values || [];
}

function serialToDate(serial) {
  return new Date(Math.round((serial - 25569) * 86400 * 1000));
}

function calcularCierreJornada(jornadaQuiniela, calendarioCierreRows, fechasCierreRows) {
  let fechaOficialSerial = null;
  for (let i = 1; i < calendarioCierreRows.length; i++) {
    if (parseInt(calendarioCierreRows[i][0]) === jornadaQuiniela) {
      fechaOficialSerial = calendarioCierreRows[i][1];
      break;
    }
  }
  if (fechaOficialSerial === null || fechaOficialSerial === undefined || fechaOficialSerial === '') return null;
  const fechaOficial = serialToDate(fechaOficialSerial);
  const esFinde = fechaOficial.getDay() === 0;
  if (esFinde) {
    let fechaViernes = null;
    for (let j = 1; j < fechasCierreRows.length; j++) {
      if (parseInt(fechasCierreRows[j][0]) !== jornadaQuiniela) continue;
      const serialF = fechasCierreRows[j][2];
      if (serialF === undefined || serialF === '') continue;
      const f = serialToDate(serialF);
      if (f.getDay() === 5) { fechaViernes = f; break; }
    }
    if (fechaViernes) {
      fechaViernes.setHours(16, 0, 0, 0);
      return fechaViernes;
    } else {
      const viernesRef = new Date(fechaOficial);
      viernesRef.setDate(viernesRef.getDate() - 2);
      viernesRef.setDate(viernesRef.getDate() + 1);
      viernesRef.setHours(0, 0, 0, 0);
      return viernesRef;
    }
  } else {
    const martes = new Date(fechaOficial);
    while (martes.getDay() !== 2) martes.setDate(martes.getDate() - 1);
    martes.setHours(16, 0, 0, 0);
    return martes;
  }
}

function parsearConfig(rows) {
  const config = {};
  const jugadores = [];
  let enJugadores = false;
  rows.forEach(row => {
    if (!row[0]) return;
    if (row[0] === 'JUGADORES') { enJugadores = true; return; }
    if (enJugadores) { if (row[0]) jugadores.push(row[0]); }
    else { config[row[0]] = row[1] || ''; }
  });
  config.jugadores = jugadores;
  return config;
}
function generarChecklist(config, paganinisRows) {
  const ahora = new Date();
  const avisos = [];

  function parseFechaConfig(campo) {
    const v = config[campo];
    if (!v) return null;
    const partes = String(v).split('/');
    if (partes.length !== 3) return null;
    return new Date(partes[2] + '-' + partes[1] + '-' + partes[0]);
  }

  // 1) Fin de temporada
  const fechaFin = parseFechaConfig('Fecha Fin');
  if (fechaFin && ahora > fechaFin) {
    avisos.push({ tipo: 'aviso', texto: 'La temporada ya debería haber terminado (Fecha Fin: ' + fechaFin.toLocaleDateString('es-ES') + '). Revisa: Config (Temporada, fechas, Semanas Totales, Fecha Cierre Temporada), Cuota actual, Paganinis en blanco, cerrarAnioEconomico(), CalendarioQuiniela del año nuevo, PronosticosFijos, y actualizar el backup.' });
  }

  // 2) Pagos de cuota pendientes tras el 31 de marzo
  const finPlazoCuota = new Date(ahora.getFullYear(), 2, 31);
  if (ahora > finPlazoCuota) {
    const pendientes = paganinisRows.slice(1).filter(r => r[0] && (r[1] === '' || r[1] === undefined));
    if (pendientes.length > 0) {
      avisos.push({ tipo: 'aviso', texto: 'Quedan ' + pendientes.length + ' pago(s) de cuota pendientes en Paganinis (ya pasó el 31 de marzo): ' + pendientes.map(r => r[0]).join(', ') });
    }
  }

  // 3) Recordatorios por fecha, sin comprobación real de datos
  const mes = ahora.getMonth() + 1;
  if (mes === 7) {
    avisos.push({ tipo: 'recordatorio', texto: 'Julio: revisa/actualiza TEMPORADA en el Apps Script (capa Quinielista) y amplía CalendarioQuiniela para la temporada que empieza.' });
  }
  if (mes === 1) {
    avisos.push({ tipo: 'recordatorio', texto: 'Enero: revisa si hay cambios en PronosticosFijos para la nueva temporada.' });
  }

  if (avisos.length === 0) {
    return '<div style="color:var(--gris); text-align:center; padding:16px;">Sin avisos pendientes ahora mismo.</div>';
  }

  return avisos.map(a => `<div style="padding:10px 0; border-bottom:1px solid #f0ede6; color:${a.tipo === 'aviso' ? 'var(--rojo)' : 'var(--tinta)'};">
    <strong>${a.tipo === 'aviso' ? '⚠️' : '📅'}</strong> ${a.texto}
  </div>`).join('');
}

function calcularJornadaCollar(jornadasRows, calendarioCierreRows, fechasCierreRows) {
  const nums = [...new Set(jornadasRows.slice(1).map(r => parseInt(r[0])).filter(n => !!n))].sort((a,b)=>a-b);
  if (!nums.length) return null;
  const ahora = new Date();
  let jornadaMostrar = nums[0];
  nums.forEach(j => {
    const cierre = calcularCierreJornada(j, calendarioCierreRows, fechasCierreRows);
    if (cierre && ahora >= cierre) jornadaMostrar = j;
  });
  return jornadaMostrar;
}

function horaAMinutos(valor) {
  if (typeof valor === 'number') return Math.round(valor * 24 * 60);
  const partes = String(valor).split(':');
  if (partes.length >= 2) return (parseInt(partes[0]) || 0) * 60 + (parseInt(partes[1]) || 0);
  return null;
}

function calcularPrimerPartido(jornada, fechasCierreRows) {
  let minFecha = null;
  for (let j = 1; j < fechasCierreRows.length; j++) {
    if (parseInt(fechasCierreRows[j][0]) !== jornada) continue;
    const serialF = fechasCierreRows[j][2];
    if (serialF === undefined || serialF === '') continue;
    const fecha = serialToDate(serialF);
    const mins = horaAMinutos(fechasCierreRows[j][3]);
    if (mins !== null) fecha.setHours(Math.floor(mins / 60), mins % 60, 0, 0);
    if (!minFecha || fecha < minFecha) minFecha = fecha;
  }
  return minFecha;
}

function formatoCuenta(ms) {
  if (ms < 0) return null;
  const totalSeg = Math.floor(ms / 1000);
  const h = Math.floor(totalSeg / 3600);
  const m = Math.floor((totalSeg % 3600) / 60);
  const s = totalSeg % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function perlaHTML(estado, actual, etiqueta, titulo) {
  if (actual) {
    return `<span class="perla-actual perla-${estado === 'actual' ? 'actual-color' : estado}" title="${titulo}"></span>
      <span class="perla-etiqueta">${etiqueta}</span>`;
  }
  return `<span class="perla perla-${estado}" title="${titulo}"></span>`;
}

function construirFila1(jornadasRows, calendarioCierreRows, fechasCierreRows, cierresLogRows, eliminacionesLogRows, campeonesRows, podiumRows, finalistasRows) {
  const jornadaCollar = calcularJornadaCollar(jornadasRows, calendarioCierreRows, fechasCierreRows);
  if (!jornadaCollar) return { html: '<p style="color:var(--gris);">Sin jornada activa.</p>', reloj: null };

  const ahora = new Date();
  const cierre = calcularCierreJornada(jornadaCollar, calendarioCierreRows, fechasCierreRows);
  const primerPartido = calcularPrimerPartido(jornadaCollar, fechasCierreRows);

  const jornadas = jornadasRows.slice(1);
  const filasJ = jornadas.filter(r => parseInt(r[0]) === jornadaCollar);
  const conResultado = filasJ.filter(r => r[4]).length;

  const enCierresLog = cierresLogRows.slice(1).some(r => parseInt(r[0]) === jornadaCollar);
  const enElimLog = eliminacionesLogRows.slice(1).some(r => parseInt(r[0]) === jornadaCollar);

  const nums = [...new Set(jornadas.map(r => parseInt(r[0])).filter(n => !!n))].sort((a,b)=>a-b);
  const posActual = nums.indexOf(jornadaCollar);
  const nextJ = posActual >= 0 && posActual + 1 < nums.length ? nums[posActual + 1] : null;
  const filasNext = nextJ ? jornadas.filter(r => parseInt(r[0]) === nextJ) : [];

  const esFinalDeVuelta = finalistasRows.slice(1).length > 0;
  const anioActual = ahora.getFullYear();
  const hayPodiumEsteAnio = campeonesRows.slice(1).some(r => String(r[0]) === String(anioActual) && r[1] === 'GranFinal');

  const plazoAbierto = cierre ? ahora < cierre : true;
  const perlas = [];

  perlas.push({ label:'plazo abierto', titulo:'Los pronósticos están abiertos para esta jornada', estado: plazoAbierto ? 'actual' : 'hecho' });
  perlas.push({ label:'plazo cerrado', titulo:'Ha pasado la hora de cierre de envío', estado: !cierre ? 'pendiente' : (ahora >= cierre ? 'hecho' : 'pendiente') });

  let estadoReparto = 'pendiente';
  if (cierre && ahora >= cierre) {
    const margen = new Date(cierre.getTime() + 60*60*1000);
    estadoReparto = enCierresLog ? 'hecho' : (ahora > margen ? 'incumplido' : 'actual');
  }
  perlas.push({ label:'reparto', titulo:'Se ha aplicado fijo/aleatorio a quien no envió a tiempo', estado: estadoReparto });

  let estadoPrimerRes = 'pendiente';
  if (primerPartido) {
    const margen = new Date(primerPartido.getTime() + 2*60*60*1000);
    estadoPrimerRes = conResultado > 0 ? 'hecho' : (ahora > margen && enCierresLog ? 'incumplido' : (enCierresLog ? 'actual' : 'pendiente'));
  }
  perlas.push({ label:'1er resultado', titulo:'Ha llegado el resultado del primer partido', estado: estadoPrimerRes });

  perlas.push({ label:'15 resultados', titulo:'Los 15 partidos ya tienen resultado', estado: conResultado === 15 ? 'hecho' : (conResultado > 0 ? 'actual' : 'pendiente') });
  perlas.push({ label:'eliminación', titulo:'Se ha decidido quién queda eliminado (o si es clasificatoria)', estado: enElimLog ? 'hecho' : (conResultado === 15 ? 'actual' : 'pendiente') });

  if (esFinalDeVuelta) {
    perlas.push({ label:'finalistas', titulo:'Finalistas de la Gran Final calculados', estado: 'hecho' });
  }
  if (hayPodiumEsteAnio) {
    perlas.push({ label:'pódium', titulo:'Pódium de la Gran Final decidido', estado: 'hecho' });
  }

  perlas.push({ label:'jornada '+(nextJ||'?')+' bajada', titulo:'Partidos de la próxima jornada descargados', estado: filasNext.length === 15 ? 'hecho' : (conResultado === 15 ? 'actual' : 'pendiente') });

  let doblesNext = false;
  if (nextJ) {
    for (let i = 1; i < calendarioCierreRows.length; i++) {
      if (parseInt(calendarioCierreRows[i][0]) === nextJ && calendarioCierreRows[i][4] !== undefined && calendarioCierreRows[i][4] !== '') { doblesNext = true; break; }
    }
  }
  perlas.push({ label:'dobles calc.', titulo:'Dobles de la próxima jornada calculados', estado: doblesNext ? 'hecho' : (filasNext.length === 15 ? 'actual' : 'pendiente') });

  let html = `<div style="font-size:12px; color:var(--gris); margin-bottom:6px;">Jornada ${jornadaCollar}</div><div class="perlas">`;
  perlas.forEach((p, i) => {
    const esActual = p.estado === 'actual';
    html += perlaHTML(p.estado, esActual, p.label, p.titulo);
    if (i < perlas.length - 1) html += '<span class="perla-hilo"></span>';
  });
  html += '</div>';

  let reloj = null;
  if (cierre && primerPartido && ahora >= cierre && ahora < primerPartido) {
    reloj = primerPartido;
  }

  return { html, reloj };
}

function construirFila2(config, operacionesRows) {
  const operaciones = operacionesRows.slice(1);
  const conteoPorSemana = {};
  const bonolotoJugado = {};
  operaciones.forEach(r => {
    const s = parseInt(r[0]);
    if (isNaN(s)) return;
    conteoPorSemana[s] = (conteoPorSemana[s] || 0) + 1;
    if (String(r[2]).toUpperCase() === 'BONOLOTO' && (parseFloat(String(r[3]||'0').replace(',','.'))||0) > 0) bonolotoJugado[s] = true;
  });
  const semanasCompletas = Object.keys(conteoPorSemana).map(Number).filter(s => conteoPorSemana[s] === 5 && bonolotoJugado[s]);
  const ultima = semanasCompletas.length ? Math.max(...semanasCompletas) : 0;

  const fechaInicioStr = config['Fecha Inicio'];
  let desfase = null;
  if (fechaInicioStr) {
    const partes = String(fechaInicioStr).split('/');
    const fechaInicio = new Date(partes[2], partes[1]-1, partes[0]);
    const semanaTeorica = Math.floor((new Date() - fechaInicio) / (7*24*60*60*1000)) + 1;
    desfase = semanaTeorica - ultima;
  }

  let html = `<div style="font-size:12px; color:var(--gris); margin-bottom:6px;">Fuera de jornada</div><div class="perlas">`;
  html += perlaHTML('hecho', false, '', 'Última semana con datos completos en Operaciones: '+ultima);
  html += '</div>';
  if (desfase !== null && desfase >= 2) {
    html += `<div style="color:var(--rojo); font-size:13px; margin-top:6px;">⚠️ Van ${desfase} semanas de diferencia entre la actual y la última traspasada (semana ${ultima}).</div>`;
  } else {
    html += `<div style="color:var(--gris); font-size:12px; margin-top:6px;">Última semana traspasada: ${ultima}</div>`;
  }
  return html;
}

async function init() {
  try {
    const [configRows, clasificRows, jornadasRows, calendarioCierreRows, fechasCierreRows, finalistasRows, paganinisRows, cierresLogRows, eliminacionesLogRows, campeonesRows, podiumRows, operacionesRows] = await Promise.all([
      leerHoja('Config'),
      leerHoja('Clasificacion'),
      leerHoja('Jornadas'),
      leerHojaSerial('CalendarioQuiniela'),
      leerHojaSerial('FechasPartidos'),
      leerHoja('GranFinalFinalistas'),
      leerHoja('Paganinis'),
      leerHoja('CierresLog'),
      leerHoja('EliminacionesLog'),
      leerHoja('Campeones'),
      leerHoja('PodiumGranFinal'),
      leerHoja('Operaciones'),
    ]);

    const config = parsearConfig(configRows);
    const jornadas = jornadasRows.slice(1);

    // Jornada actual = la primera con partidos pero sin sus 15 resultados (misma regla que el backend)
    const porJornada = {};
    jornadas.forEach(r => {
      const j = parseInt(r[0]);
      if (!j) return;
      if (!porJornada[j]) porJornada[j] = { total: 0, conResultado: 0 };
      porJornada[j].total++;
      if (r[4]) porJornada[j].conResultado++;
    });
    const ordenadas = Object.keys(porJornada).map(Number).sort((a, b) => a - b);
    let jornadaActual = null;
    for (const j of ordenadas) {
      if (porJornada[j].conResultado < 15) { jornadaActual = j; break; }
    }

    if (!jornadaActual) {
      document.getElementById('subtitulo').textContent = 'No hay ninguna jornada abierta ahora mismo.';
      document.getElementById('contenido').innerHTML = '';
      return;
    }

    const cierre = calcularCierreJornada(jornadaActual, calendarioCierreRows, fechasCierreRows);
    const ahora = new Date();
    const cerrada = cierre && ahora >= cierre;

    document.getElementById('subtitulo').innerHTML =
      `Jornada ${jornadaActual} · Cierre: ${cierre ? cierre.toLocaleString('es-ES') : '?'} ` +
      `<span class="cierre-info">(${cerrada ? 'YA CERRADA' : 'aún abierta'})</span>`;

    // ¿Finalistas de la Gran Final, o jugadores activos normales?
    const finalistas = finalistasRows.slice(1).map(r => String(r[0] || '').trim().toUpperCase()).filter(n => n);
    const esGranFinal = finalistas.length > 0 && finalistasRows.length > 1;
    // (nota: si nunca ha habido Gran Final, GranFinalFinalistas puede seguir vacía de la vez anterior;
    //  esto es solo informativo, no bloquea nada)

    let jugadoresAMostrar;
    if (esGranFinal) {
      jugadoresAMostrar = finalistas;
    } else {
      const eliminados = {};
      clasificRows.slice(1).forEach(r => {
        const nom = String(r[1] || '').trim().toUpperCase();
        if (String(r[5] || '').toLowerCase() === 'eliminado') eliminados[nom] = true;
      });
      jugadoresAMostrar = config.jugadores.filter(n => !eliminados[n.toUpperCase()]);
    }

    // Cabecera real de Jornadas para saber en qué columna está cada jugador
    const cabecera = jornadasRows[0];
    const colPorJugador = {};
    for (let c = 5; c < cabecera.length; c++) {
      const nombre = String(cabecera[c] || '').trim().toUpperCase();
      if (nombre) colPorJugador[nombre] = c;
    }

    const filasJornada = jornadas.filter(r => parseInt(r[0]) === jornadaActual);

    let htmlPartidos = '';
    filasJornada.sort((a, b) => parseInt(a[1]) - parseInt(b[1])).forEach(r => {
      htmlPartidos += `<div class="partido"><span><span class="partido-num">${r[1]}</span>${r[2]} — ${r[3]}</span></div>`;
    });

    let htmlJugadores = '';
    jugadoresAMostrar.forEach(nombre => {
      const col = colPorJugador[nombre.toUpperCase()];
      const tieneAlgo = col !== undefined && filasJornada.some(r => {
        const v = r[col];
        return v !== '' && v !== undefined && v !== null;
      });
      htmlJugadores += `<div class="jugador-fila"><span>${nombre}</span><span class="${tieneAlgo ? 'estado-ok' : 'estado-pendiente'}">${tieneAlgo ? '✓ Enviado' : '⏳ Pendiente'}</span></div>`;
    });

    let htmlTablaPron = '<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-family:\'JetBrains Mono\',monospace; font-size:13px; white-space:nowrap;">';
    htmlTablaPron += '<tr><th style="text-align:left; padding:6px 8px; border-bottom:2px solid var(--borde);">Nº</th>';
    jugadoresAMostrar.forEach(nombre => {
      htmlTablaPron += `<th style="padding:6px 8px; border-bottom:2px solid var(--borde);">${nombre.substring(0,4)}</th>`;
    });
    htmlTablaPron += '</tr>';
    filasJornada.forEach(r => {
      htmlTablaPron += `<tr><td style="padding:6px 8px; border-bottom:1px solid #f0ede6; color:var(--gris);">${r[1]}</td>`;
      jugadoresAMostrar.forEach(nombre => {
        const col = colPorJugador[nombre.toUpperCase()];
        const valor = col !== undefined ? (r[col] || '') : '';
        htmlTablaPron += `<td style="padding:6px 8px; border-bottom:1px solid #f0ede6; text-align:center; font-weight:700;">${valor}</td>`;
      });
      htmlTablaPron += '</tr>';
    });
    htmlTablaPron += '</table></div>';
    document.getElementById('contenido').innerHTML = `
      <div class="card">
        <div class="card-header">ESTADO</div>
        <div class="card-body" id="collar-jornada"></div>
        <div class="card-body" id="collar-reloj" style="display:none; border-top:1px solid var(--borde); font-weight:700; text-align:center;"></div>
        <div class="card-body" id="collar-economico" style="border-top:1px solid var(--borde);"></div>
      </div>
      <div class="card">
        <div class="card-header">CHECKLIST / AVISOS</div>
        <div class="card-body">${generarChecklist(config, paganinisRows)}</div>
      </div>
      <div class="card">
        <div class="card-header">PARTIDOS ${esGranFinal ? '(GRAN FINAL)' : ''}</div>
        <div class="card-body">${htmlPartidos}</div>
      </div>
      <div class="card">
        <div class="card-header">PRONÓSTICOS — QUIÉN FALTA</div>
        <div class="card-body">${htmlJugadores}</div>
      </div>
      <div class="card">
        <div class="card-header">PRONÓSTICOS COMPLETOS (para jugar)</div>
        <div class="card-body">${htmlTablaPron}</div>
      </div>
    `;

    const fila1 = construirFila1(jornadasRows, calendarioCierreRows, fechasCierreRows, cierresLogRows, eliminacionesLogRows, campeonesRows, podiumRows, finalistasRows);
    document.getElementById('collar-jornada').innerHTML = fila1.html;
    document.getElementById('collar-economico').innerHTML = construirFila2(config, operacionesRows);

    if (fila1.reloj) {
      const relojEl = document.getElementById('collar-reloj');
      relojEl.style.display = 'block';
      function actualizarReloj() {
        const restante = fila1.reloj - new Date();
        if (restante <= 0) { relojEl.style.display = 'none'; return; }
        relojEl.textContent = 'Tiempo para jugar el boleto: ' + formatoCuenta(restante);
      }
      actualizarReloj();
      setInterval(actualizarReloj, 1000);
    }
  } catch (e) {
    document.getElementById('contenido').innerHTML = `<div class="aviso">Error cargando datos: ${e}</div>`;
  }
}

// Barrera ligera: pide la clave la primera vez, luego la recuerda en este navegador
let claveGuardada = localStorage.getItem('admin_clave');
if (claveGuardada !== CLAVE_ADMIN) {
  claveGuardada = prompt('Clave de acceso:');
  if (claveGuardada === CLAVE_ADMIN) {
    localStorage.setItem('admin_clave', claveGuardada);
  }
}
if (claveGuardada === CLAVE_ADMIN) {
  init();
} else {
  document.getElementById('subtitulo').textContent = 'Acceso denegado.';
  document.getElementById('contenido').innerHTML = '';
}
</script>
</body>
</html>
