<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6b3c">
<title>Las 8 diferencias — Peña BandosMávila</title>
<style>:root {
  --verde: #1a6b3c;
  --verde-claro: #2d9e5f;
  --fondo: #f4f1e8;
  --papel: #ffffff;
  --tinta: #1d1d1d;
  --gris: #6b6b6b;
  --linea: #c9c3b3;
  --linea-fuerte: #3b3b3b;
  --sel: #bfe3cc;
  --vecina: #e6efe9;
  --igual: #cfe8d8;
  --mia: #1b5fa8;
  --rojo: #c0392b;
  --rojo-fondo: #f7d9d5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #14181a; --papel: #1e2427; --tinta: #eceae3; --gris: #9aa3a6;
    --linea: #3a4448; --linea-fuerte: #aab3b6; --sel: #2b5a40; --vecina: #263034;
    --igual: #2f4a3a; --mia: #7db6ee; --rojo: #ff8a7c; --rojo-fondo: #4a2824;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fondo); color: var(--tinta);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }

#cabecera {
  display: flex; align-items: center; gap: 10px;
  background: var(--verde); color: #fff; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
}
#cabecera h1 {
  margin: 0; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400;
  letter-spacing: 1.5px; font-size: 26px; line-height: 1;
}
#volver { color: #fff; text-decoration: none; font-size: 30px; line-height: 1; padding: 0 8px 4px 0; }
#datos { margin-left: auto; display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
#nivel-actual { opacity: 0.9; font-weight: 600; }
#reloj { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; }

main { max-width: 760px; margin: 0 auto; padding: 12px 10px 18px; }

/* Menú */
#pantalla-menu { display: flex; flex-direction: column; gap: 12px; max-width: 460px; margin: 10px auto 0; }
.intro { color: var(--gris); margin: 4px 2px 6px; line-height: 1.4; }
.nivel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  background: var(--papel); color: var(--tinta); border: 1.5px solid var(--verde); border-radius: 12px;
  padding: 16px 18px; cursor: pointer; font: inherit;
}
.nivel:active { background: var(--verde); color: #fff; }
.nivel-nombre { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 28px; letter-spacing: 1px; color: var(--verde); }
.nivel:active .nivel-nombre { color: #fff; }
.nivel-desc { font-size: 14px; }
.nivel-stats { font-size: 12px; color: var(--gris); min-height: 1em; }
.nivel:active .nivel-stats { color: #e3f0e8; }
.enlace {
  background: none; border: none; color: var(--verde); font: inherit; font-size: 14px; font-weight: 600;
  padding: 10px; cursor: pointer; text-decoration: underline;
}
@media (prefers-color-scheme: dark) { .enlace { color: #7fd1a1; } .nivel-nombre { color: #7fd1a1; } }

/* Cartas de la baraja española (mismo estilo que Pocha/Tute/Remigio), con tamaño según --w. */
.carta {
  --w: 58px;
  position: relative; width: var(--w); height: calc(var(--w) * 1.42); padding: calc(var(--w) * 0.14);
  background: #fffdf6; border-radius: calc(var(--w) * 0.09); border: 2px solid #17304a;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35); user-select: none; flex: none; box-sizing: border-box;
}
.carta.palo-oros { --palo-color: #b8860b; } .carta.palo-copas { --palo-color: #c0392b; }
.carta.palo-espadas { --palo-color: #2c5aa0; } .carta.palo-bastos { --palo-color: #2e7d32; }
.carta-marco { width: 100%; height: 100%; border: 1.3px solid #17304a; border-radius: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; }
.carta-marco img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.carta-banda {
  position: absolute; top: calc(var(--w) * 0.14); left: 0; width: calc(var(--w) * 0.14);
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--palo-color); line-height: 1;
}
.carta-banda b { font-size: calc(var(--w) * 0.17); font-family: Georgia, serif; }
.carta-banda svg { width: calc(var(--w) * 0.14); height: calc(var(--w) * 0.14); }
.carta.reverso { padding: 0; overflow: hidden; }
.carta.reverso img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
/* Juego */
#pantalla-juego { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#titulo-escena { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--verde); margin: 0; }
#laminas { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
.lamina { position: relative; width: min(100%, 460px); aspect-ratio: 4 / 3; background: #fff; border: 3px solid #111; border-radius: 4px; touch-action: manipulation; cursor: crosshair; }
.lamina svg { display: block; width: 100%; height: 100%; }
.lamina .num { position: absolute; left: 6px; bottom: 4px; width: 22px; height: 22px; border-radius: 50%; background: #111; color: #fff; font: 700 14px/22px 'Inter', sans-serif; text-align: center; pointer-events: none; }
.marca { fill: none; stroke: #d33; stroke-width: 4; }
.cruz { stroke: #d33; stroke-width: 5; stroke-linecap: round; animation: desvanece 0.8s forwards; }
.pista-aro { fill: none; stroke: #f5b800; stroke-width: 5; animation: latido 0.7s ease-in-out infinite; }
@keyframes desvanece { to { opacity: 0; } }
@keyframes latido { 50% { opacity: 0.35; } }
#info-juego { min-height: 1.4em; font-size: 15px; color: var(--gris); text-align: center; }
#pie-juego { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

/* Avisos y diálogos */
#aviso {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; text-align: center;
}
#aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#capa { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
#capa-caja {
  background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 22px 20px 16px; width: min(92vw, 380px);
  text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
#capa-caja h2 { margin: 0 0 8px; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px; color: var(--verde); }
@media (prefers-color-scheme: dark) { #capa-caja h2 { color: #7fd1a1; } }
#capa-caja p { margin: 6px 0; line-height: 1.45; }
#capa-caja .datos { font-size: 15px; color: var(--gris); }
#capa-caja .botones { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
#capa-caja .botones button {
  padding: 12px; border-radius: 10px; border: 1.5px solid var(--verde); background: var(--papel); color: var(--verde);
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
}
#capa-caja .botones button.principal { background: var(--verde); color: #fff; }
@media (prefers-color-scheme: dark) { #capa-caja .botones button { color: #7fd1a1; border-color: #7fd1a1; } #capa-caja .botones button.principal { color: #fff; border-color: var(--verde); } }
.girando { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--linea); border-top-color: var(--verde); border-radius: 50%; animation: gira 0.8s linear infinite; margin: 6px 0 2px; }
@keyframes gira { to { transform: rotate(360deg); } }

/* Móvil apaisado */
@media (orientation: landscape) and (max-height: 620px) {
  main { padding: 4px 10px; }
  #cabecera { padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
  #titulo-escena { display: none; }
  #laminas { flex-direction: row; justify-content: center; gap: 10px; }
  .lamina { width: min(calc(50% - 5px), calc((100svh - 130px) * 4 / 3)); }
}
@media (prefers-color-scheme: dark) { .lamina { border-color: #eee; } }
</style>
</head>
<body>
<header id="cabecera">
  <a id="volver" href="aburres.html" aria-label="Volver a ¿Te aburres?">‹</a>

  <div id="datos"><span id="nivel-actual"></span><span id="contador"></span></div>

      <button class="enlace ayuda">Cómo se juega</button>
      <button id="btn-nueva" class="enlace">Otra escena</button>
    </div>
  </section>
</main>
