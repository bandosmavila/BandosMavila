<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tute — Peña BandosMávila</title>
<style>:root {
  --fondo: #1a1026;
  --panel: #ffffff;
  --texto: #1a1a1a;
  --acento: #d4af37;
  --carta: #fffdf6;
  --oros: #b8860b;
  --copas: #c0392b;
  --espadas: #2c5aa0;
  --bastos: #2e7d32;
  --pareja-a: #e8b84b;
  --pareja-b: #6fa8dc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--fondo);
  color: var(--texto);
}

#cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: #130b1d;
  color: white;
  flex-wrap: wrap;
  gap: 8px;
}
#cabecera h1 { margin: 0; font-size: 1.3rem; }
#info-partida { color: var(--acento); font-size: 0.95rem; }
.botones-cabecera { display: flex; gap: 10px; align-items: center; }

button {
  cursor: pointer;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 0.95rem;
  background: var(--acento);
  color: #1a1a1a;
}
button.secundario { background: #ddd; }
button.principal { background: #4a2f66; color: white; font-weight: bold; }
button.peligro { background: #c0392b; color: white; font-weight: bold; }
button.peligro:hover { background: #a5281b; }

#juego {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 16px;
  padding: 16px;
}

#tapete {
  background: #2a1a3d;
  border-radius: 12px;
  padding: 16px;
  color: white;
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#triunfo-visual {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 6px 0;
}
#triunfo-visual .triunfo-texto { font-weight: bold; color: var(--acento); font-size: 1rem; }

/* --- Mesa circular (mismo patrón que Dominó/Pocha) --- */
#mesa-circular {
  position: relative;
  width: min(780px, 96vw);
  height: min(780px, 96vw);
  margin: 6px auto;
  flex-shrink: 0;
  background: radial-gradient(circle, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.22) 70%, rgba(0, 0, 0, 0.3) 100%);
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.12);
}
#mesa-circular .vacia-circulo {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60%;
  text-align: center;
  color: #cde;
  font-style: italic;
  font-size: 0.85rem;
  margin: 0;
}
.puesto-jugador {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.35);
  min-width: 120px;
  z-index: 2;
  border: 2px solid transparent;
}
.puesto-jugador.pareja-0 { border-color: var(--pareja-a); }
.puesto-jugador.pareja-1 { border-color: var(--pareja-b); }
/* A quien le toca jugar (o salir, justo tras ganar baza) se le marca con un
   resaltado que PARPADEA/BRILLA de verdad, no solo un borde fijo — a
   petición de Fide (04/10): tiene que verse claro de un vistazo quién sale,
   sobre todo justo al ganar una baza. */
.puesto-jugador.turno {
  background: rgba(255, 255, 255, 0.22);
  animation: turno-pulso 1.1s ease-in-out infinite;
}
@keyframes turno-pulso {
  0%, 100% { box-shadow: 0 0 0 3px var(--acento), 0 0 10px 2px rgba(212, 175, 55, 0.3); }
  50% { box-shadow: 0 0 0 5px var(--acento), 0 0 22px 10px rgba(212, 175, 55, 0.85); }
}
.puesto-jugador.puesto-humano { background: rgba(0, 0, 0, 0.42); border-bottom: 3px solid var(--acento); }
/* Se coloca en el lado del recuadro que da hacia el centro de la mesa
   (calculado en JS según el asiento de cada jugador — ver ladoInterior()),
   mordiendo el borde a medias: mitad dentro del recuadro, mitad fuera, hacia
   el tablero, para que se vea sin tener que fijarse. */
.insignias-cante {
  position: absolute;
  display: flex;
  gap: 2px;
  z-index: 3;
}
.insignias-cante.lado-arriba { top: -12px; left: 50%; transform: translateX(-50%); flex-direction: row; }
.insignias-cante.lado-abajo { bottom: -12px; left: 50%; transform: translateX(-50%); flex-direction: row; }
.insignias-cante.lado-izquierda { left: -12px; top: 50%; transform: translateY(-50%); flex-direction: column; }
.insignias-cante.lado-derecha { right: -12px; top: 50%; transform: translateY(-50%); flex-direction: column; }
.insignia-cante {
  background: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  border: 2px solid var(--acento);
}
.puesto-jugador .badge-mano {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.4rem;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
}
.puesto-jugador .nombre { font-size: 1rem; font-weight: bold; text-align: center; }
.puesto-jugador .etiqueta-pareja { font-size: 0.7rem; opacity: 0.8; text-align: center; }
.puesto-jugador .pila { display: flex; min-height: 102px; align-items: center; }
.puesto-jugador .pila-bazas { display: flex; align-items: center; gap: 4px; }
.puesto-jugador .pila-bazas .carta-mini { margin-left: -24px; }
.puesto-jugador .pila-bazas .carta-mini:first-child { margin-left: 0; }
.puesto-jugador .marcador-mini {
  font-size: 0.8rem;
  background: var(--acento);
  color: #1a1a1a;
  border-radius: 10px;
  padding: 2px 9px;
  font-weight: bold;
  white-space: nowrap;
}
.carta.en-circulo {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 1;
}

/* --- Componente de carta: ilustración real + marco + banda de palo ---
   (mismo estilo que Pocha/Remigio, para que los juegos se vean coherentes) */
.carta {
  position: relative;
  background: #fff;
  border-radius: 8px;
  border: 2px solid #17304a;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
  user-select: none;
  flex: none;
  box-sizing: border-box;
}
/* La mano del propio jugador se pide "un poquito más grande" que el resto
   de tamaños de carta (que siguen siendo los mismos que en Pocha/Dominó). */
.carta-grande { width: 118px; height: 168px; padding: 19px; }
.carta-mesa { width: 72px; height: 102px; border-radius: 7px; padding: 12px; }
.carta-mini { width: 40px; height: 56px; border-radius: 5px; border-width: 1.5px; padding: 0; }

.carta.palo-oros { --palo-color: #b8860b; }
.carta.palo-copas { --palo-color: #c0392b; }
.carta.palo-espadas { --palo-color: #2c5aa0; }
.carta.palo-bastos { --palo-color: #2e7d32; }

.carta-marco {
  width: 100%; height: 100%;
  border: 1.3px solid #17304a;
  border-radius: 3px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
}
.carta-marco img { width: 100%; height: 100%; object-fit: contain; }

.carta-banda {
  position: absolute; top: 19px; left: 0; width: 19px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--palo-color); line-height: 1;
}
.carta-banda b { font-size: 15px; font-family: Georgia, serif; }
.carta-mesa .carta-banda { top: 12px; width: 12px; gap: 2px; }
.carta-mesa .carta-banda b { font-size: 10px; }
.carta-mesa .carta-banda svg { width: 9px; height: 9px; }
.carta-grande .carta-banda svg { width: 15px; height: 15px; }
.carta-mini .carta-banda { display: none; }

.carta .autor {
  font-size: 0.62rem; font-weight: normal; position: absolute;
  bottom: 2px; left: 0; right: 0; text-align: center; color: #444;
  background: rgba(255, 255, 255, 0.82); line-height: 1.3;
}
.carta.reverso { padding: 0; overflow: hidden; }
.carta.reverso img { width: 100%; height: 100%; object-fit: cover; display: block; }

.carta.jugable { cursor: pointer; transform: translateY(0); transition: transform 0.1s, box-shadow 0.15s; }
.carta.jugable:hover { transform: translateY(-8px); box-shadow: 0 6px 10px rgba(0, 0, 0, 0.45); }
.carta.no-jugable { opacity: 0.35; }

.carta.jugable { cursor: pointer; transform: translateY(0); transition: transform 0.1s, box-shadow 0.15s; }
.carta.jugable:hover { transform: translateY(-8px); box-shadow: 0 6px 10px rgba(0, 0, 0, 0.45); }
.carta.no-jugable { opacity: 0.35; }
/* En Tute NUNCA se bloquea: esto es solo una orientación (verde) de lo que
   sería legal según el arrastre — se puede jugar cualquier otra igual. */
.carta.orientacion-legal { box-shadow: 0 0 0 3px #2ecc71; }

#zona-mano {
  margin: -6px auto 0;
  max-width: min(980px, 98vw);
  width: 100%;
  border-radius: 0 0 12px 12px;
  padding: 10px 12px 8px;
  background: rgba(0, 0, 0, 0.22);
  border-top: 3px solid var(--acento);
  transition: box-shadow 0.15s;
  position: relative;
  z-index: 3;
}
#zona-mano.mi-turno { box-shadow: 0 0 0 3px #e63946, 0 0 14px rgba(230, 57, 70, 0.6); background: rgba(230, 57, 70, 0.12); }
.cabecera-mano { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
#titulo-mano { font-weight: bold; }
/* Las 10 cartas de la mano SIEMPRE en una sola fila (pedido por Fide): si no
   caben a su ancho normal, se superponen un poco en vez de partir en dos
   líneas (mismo truco que las bazas acumuladas de cada jugador). */
#mano { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: center; }
#mano .carta { margin-left: -28px; transition: margin-left 0.15s; }
#mano .carta:first-child { margin-left: 0; }
#mano .carta:hover, #mano .carta.jugable:hover { z-index: 5; }

.carta.arrastrando { opacity: 0.4; }
.carta.destino { box-shadow: 0 0 0 3px #e63946; }

#lateral {
  background: white;
  border-radius: 12px;
  padding: 16px;
  max-height: 85vh;
  overflow-y: auto;
}
#lateral h2 { font-size: 1rem; margin: 0 0 8px; }
.fila-marcador { padding: 6px 0; border-bottom: 1px solid #eee; font-weight: 600; }

/* Marcador del encuentro: mucho más visible, pedido por Fide — perspectiva
   NOSOTROS/ELLOS (la pareja del jugador humano local vs. la contraria) con
   el resultado en grande tipo "4-3", y la que va ganando resaltada. En una
   futura versión online cada cliente calcularía su propio "nosotros" a
   partir de su propio índice de jugador: el diseño ya está pensado así. */
.marcador-objetivo { font-size: 0.85rem; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.marcador-grande {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 12px;
  padding: 14px 10px;
  margin-bottom: 8px;
  background: #f4f1f8;
}
.mg-lado { flex: 1; text-align: center; border-radius: 8px; padding: 6px 4px; }
.mg-lado.va-ganando { background: #fff8e6; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); }
.mg-etiqueta { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #555; margin-bottom: 2px; }
.mg-cifra { font-size: 3rem; font-weight: 900; line-height: 1; color: #2a1a3d; }
.mg-guion { font-size: 2.2rem; font-weight: 900; color: #999; padding-bottom: 4px; }
.marcador-extra { font-size: 0.85rem; color: #666; text-align: center; margin-bottom: 10px; }
#registro { padding-left: 18px; font-size: 0.85rem; }
#registro li { margin-bottom: 4px; }

dialog {
  border: none;
  border-radius: 12px;
  padding: 20px;
  max-width: 560px;
}
dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
.fila-config { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
#cfg-nombres { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.decision-opciones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }

#dlg-renuncio h2 { color: #c0392b; margin-top: 0; }

#dlg-online .codigo-mesa { font-size: 1.8rem; font-weight: bold; letter-spacing: 0.2rem; color: #2f6d33; text-align: center; margin: 10px 0; }
#dlg-online ul { padding-left: 18px; margin: 6px 0; }
#dlg-online .error-online { color: #b00020; font-weight: bold; }

/* --- Controles de la mesa: Asumir el reparto / Salir / Terminar partida --- */
#mesa-controles { margin: 14px 0; padding-top: 10px; border-top: 1px solid #eee; display: flex; gap: 8px; flex-wrap: wrap; }

/* --- Chat de la mesa (solo en partidas online) --- */
#chat-caja { margin: 14px 0; padding-top: 10px; border-top: 1px solid #eee; }
.chat-mensajes {
  max-height: 160px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.85rem;
  margin-bottom: 8px;
  padding: 6px 8px;
  background: #f6f6f6;
  border-radius: 8px;
}
.chat-linea { word-break: break-word; }
.chat-linea strong { color: #2f6d33; }
.chat-entrada { display: flex; gap: 6px; }
.chat-entrada input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.chat-entrada button { padding: 6px 12px; font-size: 0.85rem; }
</style>
</head>
<body>
<header id="cabecera">
  <h1>Tute</h1>
  <div id="info-partida"></div>
  <div class="botones-cabecera">
    <label>Velocidad bots
      <select id="velocidad">
        <option value="1200">Lenta</option>
        <option value="600" selected>Normal</option>
        <option value="150">Rápida</option>
      </select>
    </label>
    <button id="btn-renuncio" class="peligro">¡Renuncio!</button>
    <button id="btn-nueva">Nueva partida</button>
    <button id="btn-online" class="secundario">Jugar online</button>
  </div>
</header>

<main id="juego" hidden>
  <section id="tapete">
    <div id="triunfo-visual" hidden></div>
    <div id="mesa-circular"></div>
    <div id="zona-mano">
      <div class="cabecera-mano">
        <div id="titulo-mano"></div>
      </div>
      <div id="mano"></div>
    </div>
  </section>
  <aside id="lateral">
    <h2>Marcador del encuentro</h2>
    <div id="marcador"></div>
    <div id="mesa-controles" hidden>
      <button id="btn-asumir-reparto" class="secundario" hidden>Asumir el reparto</button>
      <button id="btn-salir-asiento" class="secundario" hidden>Salir (sustituir mi asiento por un bot)</button>
      <button id="btn-terminar-partida" class="secundario" hidden>Terminar partida</button>
    </div>
    <div id="chat-caja" hidden>
      <h2>Chat</h2>
      <div id="chat-mensajes" class="chat-mensajes"></div>
      <div class="chat-entrada">
        <input id="chat-input" placeholder="Escribe un mensaje..." maxlength="300">
        <button id="chat-enviar">Enviar</button>
      </div>
    </div>
    <h2>Lo que va pasando</h2>
    <ol id="registro"></ol>
  </aside>
</main>

<dialog id="dlg-renuncio"></dialog>
<dialog id="dlg-cantar"></dialog>
<dialog id="dlg-modo"></dialog>
<dialog id="dlg-config"></dialog>
<dialog id="dlg-online"></dialog>
<dialog id="dlg-fin"></dialog>
<dialog id="dlg-finmano"></dialog>

<script>(() => {
  // src/cartas.js
  var PALOS = ["oros", "copas", "espadas", "bastos"];
  var VALORES = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
  var ORDEN_FUERZA = [1, 3, 12, 11, 10, 7, 6, 5, 4, 2];
  var FUERZA_POR_VALOR = new Map(ORDEN_FUERZA.map((v, i) => [v, ORDEN_FUERZA.length - i]));
  var PUNTOS_POR_VALOR = { 1: 11, 3: 10, 12: 4, 11: 3, 10: 2 };
  function idCarta(carta) {
    return `${carta.valor}-${carta.palo}`;
  }
  function fuerza(carta) {
    return FUERZA_POR_VALOR.get(carta.valor);
  }
  function puntosCarta(carta) {
    return PUNTOS_POR_VALOR[carta.valor] || 0;
  }
  function crearMazoCompleto() {
    const mazo = [];
    for (const palo of PALOS) {
      for (const valor of VALORES) {
        mazo.push({ palo, valor });
      }
    }
    return mazo;
  }
  function barajar(mazo, azar = Math.random) {
    const copia = mazo.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(azar() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }
  function ganaCarta(a, b, paloSalida, paloTriunfo) {
    const aEsTriunfo = paloTriunfo != null && a.palo === paloTriunfo;
    const bEsTriunfo = paloTriunfo != null && b.palo === paloTriunfo;
    if (aEsTriunfo !== bEsTriunfo) return aEsTriunfo;
    const aSigue = a.palo === paloSalida;
    const bSigue = b.palo === paloSalida;
    if (aEsTriunfo && bEsTriunfo) return fuerza(a) > fuerza(b);
    if (aSigue !== bSigue) return aSigue;
    if (aSigue && bSigue) return fuerza(a) > fuerza(b);
    return false;
  }
  function cartasLegales(mano, paloSalida, paloTriunfo, cartasEnMesa = []) {
    if (paloSalida == null) return mano.slice();
    const delPalo = mano.filter((c) => c.palo === paloSalida);
    const haFalladoAlguien = cartasEnMesa.some((c) => paloTriunfo != null && c.palo === paloTriunfo && paloSalida !== paloTriunfo);
    if (delPalo.length > 0) {
      if (haFalladoAlguien) return delPalo;
      const cartasDelPaloEnMesa = cartasEnMesa.filter((c) => c.palo === paloSalida);
      if (cartasDelPaloEnMesa.length === 0) return delPalo;
      const maxFuerza = Math.max(...cartasDelPaloEnMesa.map(fuerza));
      const superiores = delPalo.filter((c) => fuerza(c) > maxFuerza);
      return superiores.length > 0 ? superiores : delPalo;
    }
    if (paloTriunfo == null) return mano.slice();
    const triunfosEnMano = mano.filter((c) => c.palo === paloTriunfo);
    const triunfosEnMesa = cartasEnMesa.filter((c) => c.palo === paloTriunfo);
    if (triunfosEnMesa.length === 0) {
      return triunfosEnMano.length > 0 ? triunfosEnMano : mano.slice();
    }
    const maxFuerzaTriunfo = Math.max(...triunfosEnMesa.map(fuerza));
    const superioresTriunfo = triunfosEnMano.filter((c) => fuerza(c) > maxFuerzaTriunfo);
    if (superioresTriunfo.length > 0) return superioresTriunfo;
    return mano.slice();
  }

  // src/mano.js
  var NJUGADORES = 4;
  function parejaDe(indiceJugador) {
    return indiceJugador % 2;
  }
  function companeroDe(indiceJugador) {
    return (indiceJugador + 2) % NJUGADORES;
  }
  function ordenCircular(desde) {
    const orden = [];
    for (let k = 0; k < NJUGADORES; k++) orden.push((desde + k) % NJUGADORES);
    return orden;
  }
  function construirManosCliente(miAsiento, miManoReal, nJugadores = NJUGADORES, nCartas = 10) {
    return Array.from({ length: nJugadores }, (_, j) => j === miAsiento ? miManoReal : Array.from({ length: nCartas }, () => ({ placeholder: true })));
  }
  function repartir(mazoBarajado, indiceMano) {
    const manos = Array.from({ length: NJUGADORES }, () => []);
    const orden = ordenCircular(indiceMano);
    let cursor = 0;
    let ultimaCartaRepartida = null;
    for (let ronda = 0; ronda < 10; ronda++) {
      for (const j of orden) {
        const carta = mazoBarajado[cursor++];
        manos[j].push(carta);
        ultimaCartaRepartida = carta;
      }
    }
    return { manos, ultimaCartaRepartida };
  }
  function tieneTute(mano) {
    if (mano.filter((c) => c.valor === 12).length === 4) return "reyes";
    if (mano.filter((c) => c.valor === 11).length === 4) return "caballos";
    return null;
  }
  function cantosDisponibles(mano, yaCantados) {
    const disponibles = [];
    for (const palo of ["oros", "copas", "espadas", "bastos"]) {
      if (yaCantados.has(palo)) continue;
      const tieneRey = mano.some((c) => c.palo === palo && c.valor === 12);
      const tieneCaballo = mano.some((c) => c.palo === palo && c.valor === 11);
      if (tieneRey && tieneCaballo) disponibles.push(palo);
    }
    return disponibles;
  }

    texto.className = "triunfo-texto";
    texto.textContent = `Triunfo: ${NOMBRE_PALO[E.actual.paloTriunfo]}`;
    cont.appendChild(texto);
    if (E.actual.cartaTriunfo) cont.appendChild(elCarta(E.actual.cartaTriunfo, { tam: "mesa" }));
  }
  function renderMarcador() {
    const cont = document.getElementById("marcador");
    cont.innerHTML = "";
    const cabecera = document.createElement("div");
    cabecera.className = "marcador-objetivo";
    cabecera.textContent = `Partida a ${E.objetivoJuegos} juegos`;
    cont.appendChild(cabecera);
    const humano = E.jugadores.findIndex((j) => j.esHumano);
    const nosotros = humano >= 0 ? parejaDe(humano) : 0;
    const ellos = nosotros === 0 ? 1 : 0;
    const juegosNosotros = E.juegosGanados[nosotros] || 0;
    const juegosEllos = E.juegosGanados[ellos] || 0;
    const vaGanandoNosotros = juegosNosotros > juegosEllos;
    const vaGanandoEllos = juegosEllos > juegosNosotros;
    const marcadorGrande = document.createElement("div");
    marcadorGrande.className = "marcador-grande";
    marcadorGrande.innerHTML = `
    <div class="mg-lado${vaGanandoNosotros ? " va-ganando" : ""}">
      <div class="mg-etiqueta">Nosotros</div>
      <div class="mg-cifra">${juegosNosotros}</div>
    </div>
    <div class="mg-guion">-</div>
    <div class="mg-lado${vaGanandoEllos ? " va-ganando" : ""}">
      <div class="mg-etiqueta">Ellos</div>
      <div class="mg-cifra">${juegosEllos}</div>
    </div>
  `;
    cont.appendChild(marcadorGrande);
    if (E.actual) {
      const extraNosotros = (E.actual.puntosBazas[nosotros] || 0) + (E.actual.puntosCantes[nosotros] || 0);
      const extraEllos = (E.actual.puntosBazas[ellos] || 0) + (E.actual.puntosCantes[ellos] || 0);
      const extra = document.createElement("div");
      extra.className = "marcador-extra";
      extra.textContent = `Esta mano: ${extraNosotros} - ${extraEllos} pts`;
      cont.appendChild(extra);
    }
  }
  function indiceEnTurno() {
    if (E.pendiente) return E.pendiente.indiceJugador;
    if (!E.actual) return null;
    const n = E.jugadores.length;
    const enMesa = E.actual.cartasEnMesa.length;
    if (enMesa > 0 && enMesa < n) return (E.actual.lider + enMesa) % n;
    return E.actual.lider;
  }
  function anguloJugador(i) {
    const n = E.jugadores.length;
    const humano = E.jugadores.findIndex((j) => j.esHumano);
    const base = humano >= 0 ? humano : 0;
    const paso = 360 / n;
    return ((180 - (i - base) * paso) % 360 + 360) % 360;
  }
  function colocarEnCirculo(el, i, radioPorc) {
    const angulo = anguloJugador(i) * Math.PI / 180;
    const x = 50 + radioPorc * Math.sin(angulo);
    const y = 50 - radioPorc * Math.cos(angulo);
    el.style.left = `${x}%`;
    el.style.top = `${y}%`;
  }
  function ladoInterior(i) {
    const angulo = anguloJugador(i) * Math.PI / 180;
    const dx = -Math.sin(angulo);
    const dy = Math.cos(angulo);
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "derecha" : "izquierda";
    return dy > 0 ? "abajo" : "arriba";
  }
  function renderMesaCircular() {
    const cont = document.getElementById("mesa-circular");
    cont.innerHTML = "";
    if (!E.actual) return;
    const enTurno = indiceEnTurno();
    const humano = E.jugadores.findIndex((j) => j.esHumano);
    E.jugadores.forEach((j, i) => {
      const esHumano = i === humano;
      const puesto = document.createElement("div");
      puesto.className = `puesto-jugador pareja-${parejaDe(i)}${i === enTurno ? " turno" : ""}${esHumano ? " puesto-humano" : ""}`;
      colocarEnCirculo(puesto, i, esHumano ? 47 : 40);
      if (i === E.actual.indiceMano) {
        const mano = document.createElement("div");
        mano.className = "badge-mano";
        mano.textContent = "🖐️";
        mano.title = "Mano de esta ronda (y quien reparte)";
        puesto.appendChild(mano);
      }
      const nombre = document.createElement("div");
      nombre.className = "nombre";
      nombre.textContent = `${j.nombre}`;
      puesto.appendChild(nombre);
      const parejaTxt = document.createElement("div");
      parejaTxt.className = "etiqueta-pareja";
      parejaTxt.textContent = `pareja ${parejaDe(i) === 0 ? "A" : "B"} (con ${nombreJ(companeroDe(i))})`;
      puesto.appendChild(parejaTxt);
      const cantosDeEste = E.actual.cantosCantados[i];
      if (cantosDeEste && cantosDeEste.length > 0) {
        const insignias = document.createElement("div");
        insignias.className = `insignias-cante lado-${ladoInterior(i)}`;
        for (const palo of cantosDeEste) {
          const ins = document.createElement("span");
          ins.className = "insignia-cante";
          ins.title = `Cantó ${palo === E.actual.paloTriunfo ? "40" : "20"} de ${NOMBRE_PALO[palo]}`;
          ins.innerHTML = iconoPalo(palo, 16);
          insignias.appendChild(ins);
        }
        puesto.appendChild(insignias);
      }
      if (i !== humano) {
        const nCartas = E.actual.manos && E.actual.manos[i] ? E.actual.manos[i].length : 0;
        const pila = document.createElement("div");
        pila.className = "pila";
        if (nCartas > 0) {
          pila.appendChild(elReverso("mesa"));
          const cuenta = document.createElement("span");
          cuenta.className = "marcador-mini";
          cuenta.textContent = `×${nCartas}`;
          pila.appendChild(cuenta);
        }
        puesto.appendChild(pila);
      }
      const hechas = E.actual.bazasHechas[i] || 0;
      if (hechas > 0) {
        const pilaBazas = document.createElement("div");
        pilaBazas.className = "pila-bazas";
        for (let k = 0; k < Math.min(hechas, 5); k++) pilaBazas.appendChild(elReverso("mini"));
        const cuentaBazas = document.createElement("span");
        cuentaBazas.className = "marcador-mini";
        cuentaBazas.textContent = `${hechas} baza${hechas === 1 ? "" : "s"}`;
        pilaBazas.appendChild(cuentaBazas);
        puesto.appendChild(pilaBazas);
      }
      cont.appendChild(puesto);
      const jugada = E.actual.cartasEnMesa.find((c) => c.jugador === i);
      if (jugada) {
        const elC = elCarta(jugada.carta, { tam: "mesa" });
        elC.classList.add("en-circulo");
        colocarEnCirculo(elC, i, 15);
        cont.appendChild(elC);
      }
    });
    if (E.actual.cartasEnMesa.length === 0) {
      const vacia = document.createElement("p");
      vacia.className = "vacia-circulo";
      vacia.textContent = "Todavía no se ha jugado ninguna carta en esta baza.";
      cont.appendChild(vacia);
    }
  }
  function moverCartaEnOrden(orden, idMovido, idDestino) {
    const desde = orden.indexOf(idMovido);
    if (desde === -1) return;
    orden.splice(desde, 1);
    const hasta = idDestino == null ? orden.length : orden.indexOf(idDestino);
    orden.splice(hasta === -1 ? orden.length : hasta, 0, idMovido);
  }
  function renderManoHumana() {
    const cont = document.getElementById("mano");
    const titulo = document.getElementById("titulo-mano");
    const zona = document.getElementById("zona-mano");
    cont.innerHTML = "";
    const esMiTurnoDeCarta = !!E.pendiente;
    zona.classList.toggle("mi-turno", esMiTurnoDeCarta);
    const humano = E.jugadores.findIndex((j) => j.esHumano);
    let cartasBase = null;
    if (esMiTurnoDeCarta) {
      cartasBase = E.pendiente.contexto.manoPropia;
      titulo.textContent = `Elige una carta, ${nombreJ(E.pendiente.indiceJugador)} — recuerda: NO se bloquea nada, pero ten cuidado con el arrastre`;
    } else if (E.actual && humano >= 0 && E.actual.manos && E.actual.manos[humano]) {
      cartasBase = E.actual.manos[humano];
      titulo.textContent = `Tu mano (${E.jugadores[humano].nombre})`;
    } else {
      titulo.textContent = "";
    }
    if (!E.actual || !cartasBase || cartasBase.length === 0) return;
    if (!E.actual.ordenMano) {
      E.actual.ordenMano = ordenarPorPalo(cartasBase).map(idCarta);
    } else {
      const presentes = new Set(cartasBase.map(idCarta));
      E.actual.ordenMano = E.actual.ordenMano.filter((id) => presentes.has(id));
      for (const carta of cartasBase) {
        const id = idCarta(carta);
        if (!E.actual.ordenMano.includes(id)) E.actual.ordenMano.push(id);
      }
    }
    const orden = E.actual.ordenMano;
    const porId = new Map(cartasBase.map((c) => [idCarta(c), c]));
    const legalesAhora = esMiTurnoDeCarta ? E.pendiente.contexto.legales : null;
    for (const id of orden) {
      const carta = porId.get(id);
      if (!carta) continue;
      const esLegal = legalesAhora ? legalesAhora.some((c) => idCarta(c) === id) : null;
      const el = elCarta(carta, { tam: "grande", jugable: esMiTurnoDeCarta ? true : null });
      if (esMiTurnoDeCarta) el.classList.toggle("orientacion-legal", !!esLegal);
      el.draggable = true;
      el.dataset.id = id;
      el.addEventListener("dragstart", (ev) => {
        ARRASTRE.id = id;
        if (ev.dataTransfer) ev.dataTransfer.effectAllowed = "move";
        setTimeout(() => el.classList.add("arrastrando"), 0);
      });
      el.addEventListener("dragend", () => {
        ARRASTRE.id = null;
        el.classList.remove("arrastrando");
        cont.querySelectorAll(".destino").forEach((n) => n.classList.remove("destino"));
      });
      el.addEventListener("dragover", (ev) => {
        if (ARRASTRE.id == null || ARRASTRE.id === id) return;
        ev.preventDefault();
        el.classList.add("destino");
      });
      el.addEventListener("dragleave", () => el.classList.remove("destino"));
      el.addEventListener("drop", (ev) => {
        ev.preventDefault();
        el.classList.remove("destino");
        if (ARRASTRE.id == null || ARRASTRE.id === id) return;
        moverCartaEnOrden(E.actual.ordenMano, ARRASTRE.id, id);
        ARRASTRE.id = null;
        render();
      });
      if (esMiTurnoDeCarta) {
        el.addEventListener("click", () => {
          const resolver = E.pendiente.resolve;
          E.pendiente = null;
          resolver(carta);
        });
      }
      cont.appendChild(el);
    }
  }
  function renderRegistro() {
    const ol = document.getElementById("registro");
    ol.innerHTML = "";
    for (const linea of E.registro) {
      const li = document.createElement("li");
      li.textContent = linea;
      ol.appendChild(li);
    }
  }
  function mostrarFin(resultado, { forzada = false } = {}) {
    const dlg = document.getElementById("dlg-fin");
    const cuerpo = forzada ? "<p>Alguien ha terminado la partida. Se queda con el marcador de juegos que había en este momento.</p>" : `<p><strong>Gana ${nombrePareja(resultado.parejaGanadoraEncuentro)}</strong></p>`;
    dlg.innerHTML = `
    <h2>${forzada ? "Partida terminada" : "Fin del encuentro"}</h2>
    ${cuerpo}
    <p>${nombrePareja(0)}: ${resultado.juegosGanados[0]} juegos · ${nombrePareja(1)}: ${resultado.juegosGanados[1]} juegos</p>
    <button id="btn-cerrar-fin">Cerrar</button>
  `;
    dlg.showModal();
    dlg.querySelector("#btn-cerrar-fin").addEventListener("click", () => dlg.close());
  }
  function abrirConfig() {
    const dlg = document.getElementById("dlg-config");
    dlg.innerHTML = `
    <h2>Nueva partida de Tute</h2>
    <p>4 jugadores fijos, parejas en cruz: A = puestos 1&3, B = puestos 2&4.</p>
    <div id="cfg-nombres"></div>
    <div class="fila-config">
      <label>Partida a cuántos juegos
        <select id="cfg-objetivo">
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10" selected>10</option>
          <option value="12">12</option>
        </select>
      </label>
    </div>
    <button id="btn-empezar" class="principal">Empezar partida</button>
  `;
    const contNombres = dlg.querySelector("#cfg-nombres");
    contNombres.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const fila = document.createElement("div");
      fila.className = "fila-config";
      const nombre = document.createElement("input");
      nombre.id = `cfg-nombre-${i}`;
      nombre.value = i === 0 ? "Tú" : `Bot ${i + 1}`;
      const humano = document.createElement("label");
      humano.innerHTML = `<input type="checkbox" id="cfg-humano-${i}" ${i === 0 ? "checked" : ""}> humano`;
      fila.appendChild(nombre);
      fila.appendChild(humano);
      contNombres.appendChild(fila);
    }
    dlg.querySelector("#btn-empezar").addEventListener("click", () => {
      E.jugadores = Array.from({ length: 4 }, (_, i) => ({
        nombre: dlg.querySelector(`#cfg-nombre-${i}`).value || `Jugador ${i + 1}`,
        esHumano: dlg.querySelector(`#cfg-humano-${i}`).checked
      }));
      E.objetivoJuegos = Number(dlg.querySelector("#cfg-objetivo").value);
      iniciarPartida();
    });
    dlg.showModal();
  }
  function abrirModo() {
    const dlg = document.getElementById("dlg-modo");
    dlg.innerHTML = `
    <h2>Tute</h2>
    <p>¿Cómo quieres jugar esta partida?</p>
    <div class="fila-config">
      <button id="btn-modo-local" class="principal">Partida local (con bots)</button>
      <button id="btn-modo-online" class="secundario">Jugar online</button>
    </div>
  `;
    dlg.querySelector("#btn-modo-local").addEventListener("click", () => {
      dlg.close();
      abrirConfig();
    });
    dlg.querySelector("#btn-modo-online").addEventListener("click", () => {
      dlg.close();
      abrirOnline();
    });
    dlg.showModal();
  }
  function abrirOnline() {
    const dlg = document.getElementById("dlg-online");
    dlg.innerHTML = `
    <h2>Jugar online</h2>
    <p>El Tute siempre es a 4, en dos parejas fijas por asiento: 0 y 2 contra 1 y 3. Eliges tu asiento al entrar, así que elegís la pareja vosotros, no el orden de llegada.</p>
    <div class="fila-config">
      <label>Tu nombre <input id="online-nombre" value="Tú"></label>
    </div>
    <div class="fila-config">
      <label>Partida a cuántos juegos
        <select id="online-objetivo">
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10" selected>10</option>
          <option value="12">12</option>
        </select>
      </label>
      <button id="btn-crear-mesa">Crear mesa nueva</button>
    </div>
    <div class="fila-config">
      <label>Código de una mesa <input id="online-codigo" maxlength="4" style="text-transform:uppercase"></label>
      <button id="btn-buscar-mesa">Buscar</button>
    </div>
    <div id="online-estado"></div>
  `;
    const estadoDiv = dlg.querySelector("#online-estado");
    const PAREJA_DE = { 0: 2, 2: 0, 1: 3, 3: 1 };
    function pintarLobby(mesaInfo, datosMesa) {
      const jugadores = (datosMesa.jugadores || []).slice().sort((a, b) => a.asiento - b.asiento);
      const esCreador = mesaInfo.uid === datosMesa.creadorUid;
      const filas = jugadores.map((j) => `<li>Asiento ${j.asiento}: ${escaparHtml(j.nombre)}${j.uid === mesaInfo.uid ? " (tú)" : ""}</li>`).join("");
      const completa = jugadores.length >= 4;
      estadoDiv.innerHTML = `
      <p class="codigo-mesa">${mesaInfo.codigo}</p>
      <p>Sentados (${jugadores.length}/4):</p>
      <ul>${filas}</ul>
      ${esCreador ? `<button id="btn-empezar-online" class="principal" ${completa ? "" : "disabled"}>Empezar partida</button>` : "<p><em>Esperando a que el creador empiece la partida...</em></p>"}
    `;
      if (esCreador) {
        estadoDiv.querySelector("#btn-empezar-online")?.addEventListener("click", () => marcarMesaJugando(mesaInfo.mesaId));
      }
    }
    let empezada = false;
    let dejarDeEscucharLobby = null;
    function escucharLobby(mesaInfo) {
      dejarDeEscucharLobby = escucharMesa(mesaInfo.mesaId, (datosMesa) => {
        if (datosMesa.estado === "jugando" && !empezada) {
          empezada = true;
          dejarDeEscucharLobby?.();
          iniciarPartidaOnline(mesaInfo, datosMesa);
          return;
        }
        pintarLobby(mesaInfo, datosMesa);
      });
    }
    function mostrarSelectorAsiento(ocupados, alElegir) {
      const porAsiento = {};
      for (const j of ocupados) porAsiento[j.asiento] = j.nombre;
      estadoDiv.innerHTML = `
      <p>Elige tu asiento:</p>
      <div class="fila-config" id="selector-asiento"></div>
      <p id="error-asiento" class="error-online"></p>
    `;
      const cont = estadoDiv.querySelector("#selector-asiento");
      for (let a = 0; a < 4; a++) {
        const ocupante = porAsiento[a];
        const btn = document.createElement("button");
        btn.className = ocupante ? "secundario" : "principal";
        btn.textContent = ocupante ? `Asiento ${a} — ${ocupante}` : `Asiento ${a} (pareja del ${PAREJA_DE[a]})`;
        btn.disabled = !!ocupante;
        btn.addEventListener("click", () => alElegir(a));
        cont.appendChild(btn);
      }
    }
    dlg.querySelector("#btn-crear-mesa").addEventListener("click", () => {
      const nombre = dlg.querySelector("#online-nombre").value.trim() || "Jugador";
      const objetivo = Number(dlg.querySelector("#online-objetivo").value);
      dlg.querySelectorAll("button").forEach((b) => {
        b.disabled = true;
      });
      mostrarSelectorAsiento([], (asiento) => {
        estadoDiv.textContent = "Creando mesa...";
        crearMesa({ nombre, objetivo, asiento }).then((mesaInfo) => {
          escucharLobby(mesaInfo);
        }).catch((e) => {
          console.error(e);
          estadoDiv.innerHTML = `<p class="error-online">${escaparHtml(e.message)}</p>`;
        });
      });
    });
    dlg.querySelector("#btn-buscar-mesa").addEventListener("click", () => {
      const codigo = dlg.querySelector("#online-codigo").value.trim();
      if (!codigo) {
        estadoDiv.innerHTML = '<p class="error-online">Pon el código de la mesa.</p>';
        return;
      }
      const nombre = dlg.querySelector("#online-nombre").value.trim() || "Jugador";
      dlg.querySelectorAll("button").forEach((b) => {
        b.disabled = true;
      });
      estadoDiv.textContent = "Buscando mesa...";
      mirarMesaPorCodigo(codigo).then(({ mesaId, uid, datos }) => {
        const yaSentado = datos.jugadores.find((j) => j.uid === uid);
        if (yaSentado) {
          escucharLobby({ mesaId, codigo: datos.codigo, miAsiento: yaSentado.asiento, uid });
          return;
        }
        function intentarSentarse(asiento) {
          estadoDiv.textContent = "Sentándote...";
          sentarseEnAsiento({ mesaId, nombre, asiento }).then((mesaInfo) => {
            escucharLobby(mesaInfo);
          }).catch((e) => {
            console.error(e);
            mostrarSelectorAsiento(datos.jugadores, intentarSentarse);
            estadoDiv.querySelector("#error-asiento").textContent = e.message;
          });
        }
        mostrarSelectorAsiento(datos.jugadores, intentarSentarse);
      }).catch((e) => {
        console.error(e);
        dlg.querySelectorAll("button").forEach((b) => {
          b.disabled = false;
        });
        estadoDiv.innerHTML = `<p class="error-online">${escaparHtml(e.message)}</p>`;
      });
    });
    dlg.showModal();
  }
  document.getElementById("btn-nueva").addEventListener("click", abrirConfig);
  document.getElementById("btn-online").addEventListener("click", abrirOnline);
  document.getElementById("btn-renuncio").addEventListener("click", abrirDialogoRenuncio);
  document.getElementById("chat-enviar").addEventListener("click", enviarChatDesdeFormulario);
  document.getElementById("chat-input").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") enviarChatDesdeFormulario();
  });
  document.getElementById("btn-asumir-reparto").addEventListener("click", () => {
    if (!E.red) return;
    asumirReparto(E.red.mesaId, E.red.uid);
  });
  document.getElementById("btn-terminar-partida").addEventListener("click", () => {
    if (!E.red) return;
    if (!confirm("¿Seguro que quieres terminar la partida ya, con el marcador actual?")) return;
    terminarMesa(E.red.mesaId);
  });
  document.getElementById("btn-salir-asiento").addEventListener("click", () => {
    if (!E.red) return;
    const miInfo = (E.red.jugadoresMesa || []).find((jm) => jm.asiento === E.red.miAsiento);
    const yaSoyBot = !!(miInfo && miInfo.sustituidoPorBot);
    marcarAsientoBot(E.red.mesaId, E.red.jugadoresMesa, E.red.miAsiento, !yaSoyBot);
  });
  abrirModo();
})();
