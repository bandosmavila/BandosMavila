<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remigio</title>
<style>[hidden] { display: none !important; }
:root {
  --tapete: #16623a;
  --tapete-osc: #0f4a2b;
  --panel: #f4efe4;
  --tinta: #1d1d1d;
  --suave: #6b6b6b;
  --acento: #f2c14e;
  --peligro: #c0392b;
  --ok: #2e7d32;
  --carta: #fffdf6;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--tinta);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--tapete-osc); min-height: 100vh; }
button { font: inherit; cursor: pointer; border: 1px solid #9c8f74; background: #fff8e6; border-radius: 6px; padding: 6px 12px; }
button:hover:not(:disabled) { background: #ffe9a8; }
button:disabled { opacity: .45; cursor: default; }
button.principal { background: var(--acento); border-color: #b38a1d; font-weight: 600; }
select, input { font: inherit; padding: 4px 6px; border-radius: 5px; border: 1px solid #b9ad93; }

#cabecera { display: flex; align-items: center; gap: 20px; padding: 8px 16px; background: #0b3a21; color: #f5f0e0; }
#cabecera h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
#info-partida { flex: 1; font-size: 14px; opacity: .9; }
.botones-cabecera { display: flex; gap: 10px; align-items: center; font-size: 14px; }

#juego { display: grid; grid-template-columns: 1fr 340px; min-height: calc(100vh - 48px); }
#tapete { background: radial-gradient(ellipse at center, #1c7a47 0%, var(--tapete) 55%, var(--tapete-osc) 100%); padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }
#lateral { background: var(--panel); padding: 12px 14px; overflow-y: auto; max-height: calc(100vh - 48px); }
#lateral h2 { font-size: 15px; margin: 6px 0 8px; text-transform: uppercase; letter-spacing: .6px; color: #5a4d33; }

/* Asientos */
#asientos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.asiento { background: rgba(0,0,0,.28); color: #f3efe2; border-radius: 10px; padding: 8px 10px; border: 2px solid transparent; min-height: 86px; position: relative; }
.asiento.turno { border-color: var(--acento); box-shadow: 0 0 14px rgba(242,193,78,.5); }
.asiento.eliminado { opacity: .35; }
.asiento .nombre { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.asiento .estilo { font-size: 12px; opacity: .8; }
.asiento .fila { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
.asiento .luz { width: 10px; height: 10px; border-radius: 50%; background: #7a7a7a; display: inline-block; }
.asiento.turno .luz { background: #5dff7a; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,.18); }
.chip.abierto { background: #2e7d32; }
.chip.repartidor { background: #8e44ad; }
.chip.humano { background: #1f5f99; }
.mini-reverso { width: 16px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(45deg, #2456a6 0 3px, #3a6fc4 3px 6px); border: 1px solid #fff; display: inline-block; }
.puntos-reeng { letter-spacing: 1px; font-size: 12px; }

/* Mesa */
#mesa { flex: 1; min-height: 180px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px 14px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.12); overflow-y: auto; }
#mesa .vacia { color: rgba(255,255,255,.55); margin: auto; }
.comb { display: flex; padding: 6px 8px 4px; border-radius: 8px; background: rgba(255,255,255,.07); border: 2px solid transparent; position: relative; }
.comb .dueño { position: absolute; top: -9px; left: 8px; font-size: 10px; color: #fff; background: rgba(0,0,0,.45); padding: 0 5px; border-radius: 6px; }
.comb .carta + .carta { margin-left: -30px; }
.comb.nueva { border-color: rgba(242,193,78,.8); background: rgba(242,193,78,.12); }
.comb.objetivo { cursor: pointer; }
.comb.objetivo:hover { border-color: #fff; background: rgba(255,255,255,.2); }

/* Centro */
#centro { display: flex; align-items: center; gap: 18px; justify-content: center; }
.monton { position: relative; }
.monton .cuenta { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; color: #e6f2e9; font-size: 12px; }
.monton.activo { cursor: pointer; }
.monton.activo .carta { box-shadow: 0 0 0 3px var(--acento), 0 4px 10px rgba(0,0,0,.4); }
.monton .hueco { width: 96px; height: 136px; border: 2px dashed rgba(255,255,255,.35); border-radius: 8px; }
#acciones { display: flex; flex-direction: column; gap: 6px; min-width: 300px; max-width: 420px; }
#acciones .estado { color: #fff; font-size: 14px; background: rgba(0,0,0,.25); padding: 6px 10px; border-radius: 6px; }
#acciones .estado b { color: var(--acento); }
#acciones .botones { display: flex; flex-wrap: wrap; gap: 6px; }

#eleccion { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--panel); padding: 14px 18px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 5; display: flex; gap: 8px; align-items: center; }

/* Mano */
#zona-mano { background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px 10px 12px; }
#titulo-mano { color: #f3efe2; font-size: 14px; margin-bottom: 6px; display: flex; gap: 12px; align-items: center; }
#titulo-mano .ordenar { margin-left: auto; display: flex; gap: 6px; }
#titulo-mano .ordenar button { padding: 2px 8px; font-size: 12px; }
#mano { display: flex; flex-wrap: nowrap; gap: 18px; min-height: 176px; padding-top: 8px; align-items: flex-end; overflow-x: auto; }
.grupo { display: flex; padding: 22px 8px 8px; border-radius: 10px; background: rgba(255,255,255,.07); position: relative; flex: none; border: 2px solid transparent; }
.grupo .carta + .carta { margin-left: -24px; }
.grupo.destino, .grupo-nuevo.destino { border-color: var(--acento); background: rgba(242,193,78,.15); }
.grupo .etiqueta { position: absolute; top: 3px; left: 8px; font-size: 11px; background: #2e7d32; color: #fff; padding: 1px 7px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.grupo .etiqueta.mala { background: #8a6d1d; }
.grupo-nuevo { flex: none; width: 104px; height: 148px; border: 2px dashed rgba(255,255,255,.35); border-radius: 10px; color: rgba(255,255,255,.6); font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; }
#mano .carta.arrastrando { opacity: .35; }
#mano .carta.soltar-antes { box-shadow: -5px 0 0 var(--acento), 0 2px 5px rgba(0,0,0,.35); }
#mano .carta.soltar-despues { box-shadow: 5px 0 0 var(--acento), 0 2px 5px rgba(0,0,0,.35); }
#mano .carta { cursor: pointer; transition: transform .12s; }
#mano .carta:hover { transform: translateY(-4px); }
#mano .carta.sel { transform: translateY(-14px); box-shadow: 0 0 0 3px var(--acento), 0 6px 14px rgba(0,0,0,.45); }
#mano .carta.nueva-robada { outline: 3px dashed #7fe3ff; outline-offset: 2px; }

/* Cartas: ilustración real + marco + banda de palo ---------------------
   (mismo estilo que Tute/Pocha, para que los juegos se vean coherentes) */
.carta {
  position: relative;
  background: var(--carta);
  border-radius: 8px;
  border: 2px solid #17304a;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .35);
  user-select: none;
  flex: none;
  box-sizing: border-box;
}
.carta-grande { width: 96px; height: 136px; padding: 16px; }
.carta-mesa { width: 68px; height: 96px; border-radius: 7px; padding: 11px; }
.carta-mini { width: 34px; height: 48px; border-radius: 4px; border-width: 1.5px; padding: 0; }

.carta.palo-O { --palo-color: #b8860b; }
.carta.palo-C { --palo-color: #c0392b; }
.carta.palo-E { --palo-color: #2c5aa0; }
.carta.palo-B { --palo-color: #2e7d32; }

.carta-marco {
  width: 100%; height: 100%;
  border: 1.3px solid #17304a;
  border-radius: 3px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
}
.carta-marco img { width: 100%; height: 100%; object-fit: contain; }

.carta-banda {
  position: absolute; top: 16px; left: 0; width: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--palo-color); line-height: 1;
}
.carta-banda b { font-size: 12px; font-family: Georgia, serif; }
.carta-mesa .carta-banda { top: 11px; width: 11px; gap: 2px; }
.carta-mesa .carta-banda b { font-size: 9px; }
.carta-mesa .carta-banda svg { width: 8px; height: 8px; }
.carta-grande .carta-banda svg { width: 12px; height: 12px; }
.carta-mini .carta-banda { display: none; }

.carta.reverso { padding: 0; overflow: hidden; }
.carta.reverso img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Comodín: no tiene ilustración real, se queda con su estrella de siempre,
   pero dentro del mismo marco doble que el resto de la baraja. */
.carta.comodin { background: var(--carta); }
.carta-marco.comodin-marco { background: linear-gradient(160deg, #fff 0%, #f1e6ff 100%); color: #7b2cbf; }
.comodin-estrella { font-size: 38px; }
.carta-mesa .comodin-estrella { font-size: 26px; }
.carta-mini .comodin-estrella { font-size: 16px; }
.carta.comodin .pie {
  position: absolute; bottom: 2px; left: 0; right: 0; text-align: center;
  font-size: 9px; font-weight: 700; letter-spacing: .5px; color: #7b2cbf;
}
.carta-mesa.comodin .pie, .carta-mini.comodin .pie { display: none; }
.carta .repr {
  position: absolute; bottom: -15px; left: -4px; right: -4px; text-align: center;
  font-size: 10px; color: #fff; background: #7b2cbf; border-radius: 5px;
  white-space: nowrap; z-index: 2;
}

/* Marcador */
#marcador table { width: 100%; border-collapse: collapse; font-size: 13px; }
#marcador th { text-align: left; font-weight: 600; color: #5a4d33; border-bottom: 1px solid #cfc3a6; padding: 3px 4px; }
#marcador td { padding: 4px; border-bottom: 1px solid #e3d9c2; }
#marcador tr.turno td { background: #fff1c7; }
#marcador tr.eliminado td { color: #aaa; text-decoration: line-through; }
#marcador .bote { margin-top: 8px; font-size: 15px; }
#registro { font-size: 13px; padding-left: 20px; margin: 0; }
#registro li { margin: 2px 0; }
#registro li.destacado { font-weight: 700; }

/* Cubierta y aviso */
#cubierta { position: fixed; inset: 0; background: rgba(8,40,22,.96); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 20; font-size: 22px; }
#aviso { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #3b1f1f; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: 80vw; }
#aviso.info { background: #1f3b2b; }

/* Diálogos */
dialog { border: none; border-radius: 12px; padding: 20px 24px; background: var(--panel); max-width: min(1100px, 95vw); max-height: 90vh; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog h2 { margin-top: 0; }
.config-asientos { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 12px; align-items: center; margin: 12px 0; }
.config-asientos .desc { font-size: 12px; color: var(--suave); }
.config-opciones { display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0; }
.error { color: var(--peligro); font-weight: 600; min-height: 1.2em; }
.fin-tabla { border-collapse: collapse; width: 100%; font-size: 14px; }
.fin-tabla td, .fin-tabla th { padding: 6px 8px; border-bottom: 1px solid #d8ccb0; vertical-align: middle; text-align: left; }
.fin-tabla .cartas { display: flex; flex-wrap: wrap; gap: 3px; }
.fin-tabla tr.pierde td { background: #fbe3df; }
.fin-tabla tr.cierra td { background: #e3f3e4; }
.est-tabla { border-collapse: collapse; font-size: 13px; }
.est-tabla th, .est-tabla td { padding: 5px 8px; border-bottom: 1px solid #d8ccb0; text-align: right; }
.est-tabla th:first-child, .est-tabla td:first-child { text-align: left; }
.dlg-botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.titular { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

.botones-eliminado { display: flex; gap: 8px; margin-top: 6px; }
#aviso.mazo { background: #1f3b6b; font-size: 16px; }

/* --- Online: lobby, controles de la mesa y chat --- */
.fila-config { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; align-items: flex-end; }
.fila-config label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
#dlg-online, #dlg-modo { max-width: 520px; }
#dlg-online .codigo-mesa { font-size: 30px; font-weight: bold; letter-spacing: 4px; color: #1f5f99; text-align: center; margin: 10px 0; }
#dlg-online ul { padding-left: 18px; margin: 6px 0; }
#dlg-online .error-online { color: var(--peligro); font-weight: 700; }
#mesa-controles { margin: 14px 0; padding-top: 10px; border-top: 1px solid #d8cfb8; display: flex; gap: 8px; flex-wrap: wrap; }
#chat-caja { margin: 14px 0; padding-top: 10px; border-top: 1px solid #d8cfb8; }
.chat-mensajes { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; margin-bottom: 8px; padding: 6px 8px; background: #fffdf6; border: 1px solid #d8cfb8; border-radius: 8px; }
.chat-linea { word-break: break-word; }
.chat-linea strong { color: #1f5f99; }
.chat-entrada { display: flex; gap: 6px; }
.chat-entrada input { flex: 1; min-width: 0; }
.chip.bot { background: #7a6a3a; }
.asiento.yo { border-color: rgba(255,255,255,.55); }

/* Dentro del lobby solo se ve el estado de la mesa (si no, con 6 jugadores el botón queda fuera de la pantalla). */
#dlg-online.en-lobby > :not(h2):not(#online-estado):not(.dlg-botones) { display: none; }
#dlg-online.en-lobby ul { columns: 2; list-style: none; padding-left: 0; }
#dlg-online .codigo-mesa { margin: 4px 0; }

/* ======================================================================
   Colores FIJOS por asiento (el mismo color para todos los jugadores):
   el puesto de cada jugador, sus combinaciones en la mesa y su puntito en el
   marcador. A quien le toca: resplandor BLANCO parpadeante (el dorado se
   confundiría con el amarillo del asiento 1).
   ====================================================================== */
.asiento { border-width: 3px; border-color: var(--col, transparent); background: linear-gradient(var(--col-fondo, transparent), var(--col-fondo, transparent)), rgba(0, 0, 0, 0.3); }
.asiento.yo { border-color: var(--col, rgba(255, 255, 255, .55)); }
.asiento.turno {
  border-color: var(--col, #fff);
  background: linear-gradient(var(--col-fondo-turno, transparent), var(--col-fondo-turno, transparent)), rgba(0, 0, 0, 0.25);
  animation: turno-pulso-blanco 1.1s ease-in-out infinite;
}
.asiento .nombre { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
@keyframes turno-pulso-blanco {
  0%, 100% { box-shadow: 0 0 0 2px #fff, 0 0 10px 2px rgba(255, 255, 255, 0.35); }
  50% { box-shadow: 0 0 0 4px #fff, 0 0 20px 8px rgba(255, 255, 255, 0.8); }
}
.comb { border-color: var(--col, transparent); background: linear-gradient(var(--col-suave, transparent), var(--col-suave, transparent)), rgba(255, 255, 255, 0.05); }
.comb .dueño { background: var(--col, rgba(0, 0, 0, .45)); color: #1a1a1a; font-weight: 700; }
.comb.nueva { border-color: rgba(242, 193, 78, .9); }
.punto-asiento { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--col, #999); margin-right: 6px; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }

/* ======================================================================
   MÓVIL
   Todo lo de abajo solo se activa en pantallas pequeñas; en el ordenador
   la pantalla queda como antes (salvo los colores de arriba).
   ====================================================================== */
.solo-movil { display: none; }
#aviso-girar { display: none; }

/* Móvil en vertical: se pide que se gire. */
@media (orientation: portrait) and (max-width: 700px) {
  #aviso-girar {
    display: flex; position: fixed; inset: 0; z-index: 2000;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #0b3a21; color: white; text-align: center; padding: 24px;
  }
  body > :not(#aviso-girar) { display: none !important; }
  html, body { overflow: hidden; }
  .giro-icono { font-size: 4rem; animation: girar-movil 2.4s ease-in-out infinite; }
  .giro-titulo { font-size: 1.5rem; font-weight: bold; color: var(--acento); }
  .giro-texto { font-size: 1.05rem; opacity: 0.9; }
}
@keyframes girar-movil { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

/* Móvil en horizontal (pantalla baja y apaisada). */
@media (max-height: 560px) and (orientation: landscape) {
  body { overflow: hidden; min-height: 0; }
  dialog { max-height: 92dvh; overflow-y: auto; padding: 12px 16px; max-width: min(760px, 96vw); }
  dialog h2 { margin: 0 0 8px; font-size: 1.1rem; }
  button { padding: 8px 12px; }

  /* Cabecera: solo el botón ☰ (flotante) con el menú desplegable. */
  #cabecera { position: fixed; top: 4px; right: 4px; z-index: 50; padding: 0; background: none; gap: 0; }
  #cabecera h1, #info-partida { display: none; }
  #btn-menu-movil { display: block; width: 42px; height: 34px; padding: 0; font-size: 1.3rem; background: rgba(0, 0, 0, 0.55); color: #fff; border: none; }
  .botones-cabecera {
    position: fixed; top: 42px; right: 4px; z-index: 50; width: 200px;
    flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; border-radius: 10px;
    background: #082b18; visibility: hidden;
  }
  #cabecera.abierto .botones-cabecera { visibility: visible; }
  .botones-cabecera label { color: #fff; font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
  #btn-pantalla-completa { display: block; }

  /* Tapete: una sola pantalla, en rejilla. Arriba los asientos; en medio mazo, pozo, mesa y acciones; abajo mi mano. */
  #juego { display: block; min-height: 0; }
  #tapete {
    display: grid; grid-template-columns: 50px 50px minmax(0, 1fr) 156px; grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 3px 6px; padding: 3px 34px 0 6px; height: 100dvh; min-height: 0; border-radius: 0;
  }
  #asientos { grid-column: 1 / -1; grid-row: 1; gap: 4px; margin-right: 22px; }
  #centro { display: contents; }
  #mazo { grid-column: 1; grid-row: 2; align-self: start; margin-top: 4px; }
  #pozo { grid-column: 2; grid-row: 2; align-self: start; margin-top: 4px; }
  #mesa { grid-column: 3; grid-row: 2; min-height: 0; padding: 4px 6px; gap: 12px 8px; }
  #mesa::before { content: attr(data-info); flex: 0 0 100%; font-size: 0.62rem; color: rgba(255, 255, 255, .7); margin: -2px 0 0; }
  #mesa .vacia { font-size: 0.75rem; }
  #acciones { grid-column: 4; grid-row: 2; min-width: 0; max-width: none; overflow-y: auto; gap: 4px; }
  #zona-mano { grid-column: 1 / -1; grid-row: 3; margin: 0 -34px 0 -6px; border-radius: 0; padding: 2px 40px 4px 8px; }

  /* Asientos: fichas pequeñas con nombre y recuento. */
  .asiento { padding: 2px 6px; min-height: 0; border-radius: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; overflow: hidden; }
  .asiento .nombre { flex: 1 1 100%; font-size: 0.72rem; gap: 4px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .asiento .estilo { display: none; }
  .asiento .luz { display: none; }
  .asiento .fila { margin-top: 0; font-size: 0.62rem; gap: 4px; }
  .asiento .chip { font-size: 0.55rem; padding: 0 4px; }
  .puntos-reeng { font-size: 0.5rem; letter-spacing: 0; }
  .mini-reverso { width: 11px; height: 15px; }

  /* Mazo y pozo. */
  .monton .carta-grande { width: 44px; height: 62px; padding: 7px; }
  .monton .carta.reverso { padding: 0; }
  .monton .hueco { width: 44px; height: 62px; }
  .monton .cuenta { font-size: 0.55rem; bottom: -22px; left: -3px; right: -3px; line-height: 1.1; }
  .monton .carta-banda { top: 6px; width: 8px; gap: 1px; }
  .monton .carta-banda b { font-size: 7px; }
  .monton .carta-banda svg { width: 6px; height: 6px; }
  .monton .comodin-estrella { font-size: 18px; }

  /* Combinaciones de la mesa. */
  .comb { padding: 8px 5px 3px; }
  .comb .dueño { font-size: 8px; top: -8px; }
  .carta-mesa { width: 40px; height: 57px; padding: 6px; border-radius: 5px; }
  .carta-mesa .carta-banda { top: 6px; width: 8px; gap: 1px; }
  .carta-mesa .carta-banda b { font-size: 7px; }
  .carta-mesa .carta-banda svg { width: 6px; height: 6px; }
  .comb .carta + .carta { margin-left: -21px; }

      destino = null;
      if (!t) return;
      const carta = t.closest("#mano .carta");
      const grupoEl = t.closest("#mano .grupo");
      if (carta && grupoEl && !ids.includes(Number(carta.dataset.id))) {
        const r = carta.getBoundingClientRect();
        const despues = x >= r.left + r.width / 2;
        carta.classList.add(despues ? "soltar-despues" : "soltar-antes");
        const real = grupos.findIndex((g) => g.includes(Number(carta.dataset.id)));
        if (real >= 0) destino = { gi: real, pos: grupos[real].indexOf(Number(carta.dataset.id)) + (despues ? 1 : 0) };
      } else if (grupoEl) {
        grupoEl.classList.add("destino");
        const idCualquiera = Number(grupoEl.querySelector(".carta")?.dataset.id);
        const real = grupos.findIndex((g) => g.includes(idCualquiera));
        if (real >= 0) destino = { gi: real, pos: grupos[real].length };

        const nuevo = t.closest("#mano .grupo-nuevo") || (t.closest("#zona-mano") && !t.closest("#titulo-mano") ? cont.querySelector(".grupo-nuevo") : null);
        if (nuevo) {

    const mover = (e) => {
