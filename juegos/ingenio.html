<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6b3c">
<title>Ingenio — Peña BandosMávila</title>
<style>:root {
  --verde: #1a6b3c;
  --verde-claro: #2d9e5f;
  --fondo: #f4f1e8;
  --papel: #ffffff;
  --tinta: #1d1d1d;
  --gris: #6b6b6b;
  --linea: #c9c3b3;
  --linea-fuerte: #3b3b3b;
  --sel: #bfe3cc;
  --vecina: #e6efe9;
  --igual: #cfe8d8;
  --mia: #1b5fa8;
  --rojo: #c0392b;
  --rojo-fondo: #f7d9d5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #14181a; --papel: #1e2427; --tinta: #eceae3; --gris: #9aa3a6;
    --linea: #3a4448; --linea-fuerte: #aab3b6; --sel: #2b5a40; --vecina: #263034;
    --igual: #2f4a3a; --mia: #7db6ee; --rojo: #ff8a7c; --rojo-fondo: #4a2824;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fondo); color: var(--tinta);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }

#cabecera {
  display: flex; align-items: center; gap: 10px;
  background: var(--verde); color: #fff; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
}
#cabecera h1 {
  margin: 0; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400;
  letter-spacing: 1.5px; font-size: 26px; line-height: 1;
}
#volver { color: #fff; text-decoration: none; font-size: 30px; line-height: 1; padding: 0 8px 4px 0; }
#datos { margin-left: auto; display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
#nivel-actual { opacity: 0.9; font-weight: 600; }
#reloj { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; }

main { max-width: 760px; margin: 0 auto; padding: 12px 10px 18px; }

/* Menú */
#pantalla-menu { display: flex; flex-direction: column; gap: 12px; max-width: 460px; margin: 10px auto 0; }
.intro { color: var(--gris); margin: 4px 2px 6px; line-height: 1.4; }
.nivel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  background: var(--papel); color: var(--tinta); border: 1.5px solid var(--verde); border-radius: 12px;
  padding: 16px 18px; cursor: pointer; font: inherit;
}
.nivel:active { background: var(--verde); color: #fff; }
.nivel-nombre { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 28px; letter-spacing: 1px; color: var(--verde); }
.nivel:active .nivel-nombre { color: #fff; }
.nivel-desc { font-size: 14px; }
.nivel-stats { font-size: 12px; color: var(--gris); min-height: 1em; }
.nivel:active .nivel-stats { color: #e3f0e8; }
.enlace {
  background: none; border: none; color: var(--verde); font: inherit; font-size: 14px; font-weight: 600;
  padding: 10px; cursor: pointer; text-decoration: underline;
}
@media (prefers-color-scheme: dark) { .enlace { color: #7fd1a1; } .nivel-nombre { color: #7fd1a1; } }

/* Avisos y diálogos */
#aviso {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; text-align: center;
}
#aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#capa { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
#capa-caja {
  background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 22px 20px 16px; width: min(92vw, 380px);
  text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
#capa-caja h2 { margin: 0 0 8px; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px; color: var(--verde); }
@media (prefers-color-scheme: dark) { #capa-caja h2 { color: #7fd1a1; } }
#capa-caja p { margin: 6px 0; line-height: 1.45; }
#capa-caja .datos { font-size: 15px; color: var(--gris); }
#capa-caja .botones { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
#capa-caja .botones button {
  padding: 12px; border-radius: 10px; border: 1.5px solid var(--verde); background: var(--papel); color: var(--verde);
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
}
#capa-caja .botones button.principal { background: var(--verde); color: #fff; }
@media (prefers-color-scheme: dark) { #capa-caja .botones button { color: #7fd1a1; border-color: #7fd1a1; } #capa-caja .botones button.principal { color: #fff; border-color: var(--verde); } }
.girando { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--linea); border-top-color: var(--verde); border-radius: 50%; animation: gira 0.8s linear infinite; margin: 6px 0 2px; }
@keyframes gira { to { transform: rotate(360deg); } }


/* Ingenio */
#menu-tipos { display: flex; flex-direction: column; gap: 12px; }
#pantalla-juego { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 480px; margin: 0 auto; }
#progreso { color: var(--gris); font-size: 14px; }
#zona { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.enunciado { font-size: 18px; line-height: 1.45; text-align: center; margin: 4px 6px; -webkit-user-select: text; user-select: text; }
.dibujo { font-size: 56px; line-height: 1.2; text-align: center; letter-spacing: 4px; }
.sucesion { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.num { min-width: 52px; padding: 12px 8px; text-align: center; border: 2px solid var(--verde); border-radius: 10px; font-size: 24px; font-weight: 700; background: var(--papel); }
.num.falta { border-style: dashed; color: var(--gris); }
.respuesta { display: flex; gap: 8px; width: 100%; }
.respuesta input { flex: 1; min-width: 0; font: inherit; font-size: 20px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--linea-fuerte); background: var(--papel); color: var(--tinta); -webkit-user-select: text; user-select: text; text-align: center; }
.respuesta input.mal { border-color: var(--rojo); background: var(--rojo-fondo); }
.opciones { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.opcion, .boton {
  padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--verde); background: var(--papel); color: var(--tinta);
  font: inherit; font-size: 16px; cursor: pointer; text-align: left;
}
.boton { text-align: center; font-weight: 600; color: var(--verde); }
.boton.principal { background: var(--verde); color: #fff; }
.opcion:active, .boton:active { background: var(--vecina); }
.opcion.bien { background: #d6f0de; border-color: #2d9e5f; color: #17331f; }
.opcion.mal { background: var(--rojo-fondo); border-color: var(--rojo); }
.opcion:disabled { opacity: 1; cursor: default; }
.filas-botones { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
.mensaje { min-height: 1.4em; text-align: center; color: var(--gris); font-size: 15px; margin: 0 6px; }
.mensaje.bien { color: #1d7a45; font-weight: 600; } .mensaje.mal { color: var(--rojo); font-weight: 600; }
@media (prefers-color-scheme: dark) { .boton { color: #7fd1a1; } .boton.principal { color: #fff; } .opcion.bien { color: #d9f3e3; background: #1f4a31; } .mensaje.bien { color: #7fd1a1; } }
#cerillas { width: 100%; max-width: 440px; touch-action: manipulation; }
#cerillas .palo { stroke: #c79a54; stroke-width: 5; stroke-linecap: round; }
#cerillas .cabeza { fill: #c0392b; }
#cerillas .hueco { stroke: var(--linea); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 3 6; }
#cerillas .fija { stroke: var(--gris); stroke-width: 5; stroke-linecap: round; }
#cerillas .tocar { stroke: transparent; stroke-width: 22; stroke-linecap: round; cursor: pointer; }
#cerillas .mano .palo { stroke: #2d9e5f; } #cerillas .mano .cabeza { fill: #2d9e5f; }
#cerillas .sitio:hover .hueco, #cerillas .libre .hueco { stroke: var(--verde); }
@media (orientation: landscape) and (max-height: 620px) { main { padding: 4px 10px; } .dibujo { font-size: 40px; } }
</style>
</head>
<body>
<header id="cabecera">
  <a id="volver" href="aburres.html" aria-label="Volver a ¿Te aburres?">‹</a>
  <h1>Ingenio</h1>
  <div id="datos"><span id="nivel-actual"></span><span id="contador"></span></div>
</header>
<main>
  <section id="pantalla-menu" hidden>
    <p class="intro">Acertijos de varios tipos para darle a la cabeza. Cada ronda mezcla unos cuantos; tu partida se guarda sola.</p>
    <div id="menu-tipos"></div>
  </section>
  <section id="pantalla-juego" hidden>
    <div id="progreso"></div>
    <div id="zona"></div>
    <div id="mensaje" class="mensaje" role="status"></div>
    <div class="filas-botones" id="botones"></div>
    <div class="filas-botones"><button class="enlace" id="btn-ayuda">Cómo se juega</button><button class="enlace" id="btn-menu">Otro tipo</button></div>
  </section>
</main>
<div id="aviso" role="status" aria-live="polite"></div>
<div id="capa" hidden><div id="capa-caja"></div></div>
