<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6b3c">
<title>Palabra — Peña BandosMávila</title>
<style>:root {
  --verde: #1a6b3c;
  --verde-claro: #2d9e5f;
  --fondo: #f4f1e8;
  --v: #3fae6c; --a: #d9a521; --g: #8b8f8a; --vacia: #ffffff; --letra-c: #ffffff;
  --papel: #ffffff;
  --tinta: #1d1d1d;
  --gris: #6b6b6b;
  --linea: #c9c3b3;
  --linea-fuerte: #3b3b3b;
  --sel: #bfe3cc;
  --vecina: #e6efe9;
  --igual: #cfe8d8;
  --mia: #1b5fa8;
  --rojo: #c0392b;
  --rojo-fondo: #f7d9d5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #14181a; --papel: #1e2427; --tinta: #eceae3; --gris: #9aa3a6;
    --linea: #3a4448; --linea-fuerte: #aab3b6; --sel: #2b5a40; --vecina: #263034;
    --igual: #2f4a3a; --mia: #7db6ee; --v: #2d9e5f; --a: #b88a14; --g: #4a5256; --vacia: #1e2427; --rojo: #ff8a7c; --rojo-fondo: #4a2824;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fondo); color: var(--tinta);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }

#cabecera {
  display: flex; align-items: center; gap: 10px;
  background: var(--verde); color: #fff; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
}
#cabecera h1 {
  margin: 0; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400;
  letter-spacing: 1.5px; font-size: 26px; line-height: 1;
}
#volver { color: #fff; text-decoration: none; font-size: 30px; line-height: 1; padding: 0 8px 4px 0; }
#datos { margin-left: auto; display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
#nivel-actual { opacity: 0.9; font-weight: 600; }
#reloj { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; }

main { max-width: 760px; margin: 0 auto; padding: 12px 10px 18px; }

/* Menú */
#pantalla-menu { display: flex; flex-direction: column; gap: 12px; max-width: 460px; margin: 10px auto 0; }
.intro { color: var(--gris); margin: 4px 2px 6px; line-height: 1.4; }
.nivel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  background: var(--papel); color: var(--tinta); border: 1.5px solid var(--verde); border-radius: 12px;
  padding: 16px 18px; cursor: pointer; font: inherit;
}
.nivel:active { background: var(--verde); color: #fff; }
.nivel-nombre { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 28px; letter-spacing: 1px; color: var(--verde); }
.nivel:active .nivel-nombre { color: #fff; }
.nivel-desc { font-size: 14px; }
.nivel-stats { font-size: 12px; color: var(--gris); min-height: 1em; }
.nivel:active .nivel-stats { color: #e3f0e8; }
.enlace {
  background: none; border: none; color: var(--verde); font: inherit; font-size: 14px; font-weight: 600;
  padding: 10px; cursor: pointer; text-decoration: underline;
}
@media (prefers-color-scheme: dark) { .enlace { color: #7fd1a1; } .nivel-nombre { color: #7fd1a1; } }

/* Juego */
#pantalla-juego { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#zona-tablero { display: flex; flex-direction: column; align-items: center; gap: 6px; }
#tablero { --t: min(58px, calc((100vw - 40px - (var(--n) - 1) * 6px) / var(--n))); display: grid; gap: 6px; }
.fila { display: grid; grid-template-columns: repeat(var(--n), var(--t)); gap: 6px; }
.fila.sacudida { animation: sacude 0.4s; }
@keyframes sacude { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.casilla {
  width: var(--t); height: var(--t); display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--linea); border-radius: 6px; background: var(--vacia); color: var(--tinta);
  font-weight: 700; font-size: calc(var(--t) * 0.55); text-transform: uppercase;
}
.casilla.escrita { border-color: var(--linea-fuerte); transform: scale(1.04); }
.casilla.pista { border-style: dashed; border-color: var(--verde-claro); color: var(--verde-claro); }
.casilla.v, .casilla.a, .casilla.g { color: #fff; border-color: transparent; animation: vuelta 0.5s both; animation-delay: calc(var(--i) * 0.12s); }
.casilla.v { background: var(--v); } .casilla.a { background: var(--a); } .casilla.g { background: var(--g); }
.casilla.fijo { animation: none; }
@keyframes vuelta { 0% { transform: rotateX(0); background: var(--vacia); color: var(--tinta); } 49% { transform: rotateX(90deg); background: var(--vacia); color: var(--tinta); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
#info-juego { min-height: 1.4em; font-size: 14px; color: var(--gris); text-align: center; max-width: 360px; }
#info-juego.mal { color: var(--rojo); font-weight: 600; }

#teclado { display: flex; flex-direction: column; gap: 6px; width: min(calc(100vw - 12px), 500px); }
.tecla-fila { display: flex; gap: 5px; justify-content: center; }
.tecla {
  flex: 1 1 0; max-width: 44px; height: 50px; border: none; border-radius: 6px; background: var(--linea); color: var(--tinta);
  font: inherit; font-weight: 700; font-size: 16px; text-transform: uppercase; cursor: pointer; padding: 0; min-width: 0;
}
.tecla.ancha { flex: 1.6 1 0; max-width: 70px; font-size: 13px; }
.tecla:active { filter: brightness(0.9); }
.tecla.v { background: var(--v); color: #fff; } .tecla.a { background: var(--a); color: #fff; } .tecla.g { background: var(--g); color: #fff; opacity: 0.8; }
#pie-juego { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
#capa-caja .repaso { font-size: 14px; color: var(--gris); }
#capa-caja .palabra { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 40px; letter-spacing: 2px; color: var(--verde); margin: 4px 0; text-transform: uppercase; }
@media (prefers-color-scheme: dark) { #capa-caja .palabra { color: #7fd1a1; } }
#niveles { display: flex; flex-direction: column; gap: 12px; }
#niveles .nivel { width: 100%; }

/* Avisos y diálogos */
#aviso {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; text-align: center;
}
#aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#capa { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
#capa-caja {
  background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 22px 20px 16px; width: min(92vw, 380px);
  text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
#capa-caja h2 { margin: 0 0 8px; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px; color: var(--verde); }
@media (prefers-color-scheme: dark) { #capa-caja h2 { color: #7fd1a1; } }
#capa-caja p { margin: 6px 0; line-height: 1.45; }
#capa-caja .datos { font-size: 15px; color: var(--gris); }
#capa-caja .botones { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
#capa-caja .botones button {
  padding: 12px; border-radius: 10px; border: 1.5px solid var(--verde); background: var(--papel); color: var(--verde);
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
}
#capa-caja .botones button.principal { background: var(--verde); color: #fff; }
@media (prefers-color-scheme: dark) { #capa-caja .botones button { color: #7fd1a1; border-color: #7fd1a1; } #capa-caja .botones button.principal { color: #fff; border-color: var(--verde); } }
.girando { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--linea); border-top-color: var(--verde); border-radius: 50%; animation: gira 0.8s linear infinite; margin: 6px 0 2px; }
@keyframes gira { to { transform: rotate(360deg); } }

/* Móvil apaisado */
@media (orientation: landscape) and (max-height: 620px) {
  main { padding: 4px 10px; }
  #cabecera { padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
  #pantalla-juego { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 20px; }
  #tablero { --t: min(40px, calc((100svh - 100px - 5 * 6px) / 6)); gap: 4px; }
  .fila { gap: 4px; }
  #teclado { width: min(48vw, 420px); }
  .tecla { height: 40px; }
  #pie-juego { flex: 0 0 100%; }
}
</style>
</head>
<body>
<header id="cabecera">
  <a id="volver" href="aburres.html" aria-label="Volver a ¿Te aburres?">‹</a>
  <h1>Palabra</h1>
  <div id="datos"><span id="nivel-actual"></span><span id="contador" aria-label="Intentos"></span></div>
</header>

<main>
  <section id="pantalla-menu" hidden>
    <p class="intro">Adivina la palabra en 6 intentos. La partida se guarda sola: puedes dejarla y seguir más tarde.</p>
    <div id="niveles">
      <button class="nivel" data-nivel="normal"><span class="nivel-nombre">Normal</span><span class="nivel-desc">Palabras de 5 letras</span><span class="nivel-stats" id="stats-normal"></span></button>
      <button class="nivel" data-nivel="anormal"><span class="nivel-nombre">Anormal</span><span class="nivel-desc">Palabras de 6 letras</span><span class="nivel-stats" id="stats-anormal"></span></button>
    </div>
    <button class="enlace ayuda">Cómo se juega</button>
    <button id="btn-cancelar-menu" class="enlace" hidden>Volver a mi partida</button>
  </section>

  <section id="pantalla-juego" hidden>
    <div id="zona-tablero">
      <div id="tablero" role="grid" aria-label="Intentos"></div>
      <div id="info-juego"></div>
    </div>
    <div id="teclado" aria-label="Teclado"></div>
    <div id="pie-juego">
      <button id="btn-pista" class="enlace">Pista</button>
      <button class="enlace ayuda">Cómo se juega</button>
      <button id="btn-nueva" class="enlace">Otra palabra</button>
    </div>
  </section>
</main>

<div id="aviso" role="status" aria-live="polite"></div>
<div id="capa" hidden><div id="capa-caja"></div></div>
