<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6b3c">
<title>Sudoku — Peña BandosMávila</title>
<style>:root {
  --verde: #1a6b3c;
  --verde-claro: #2d9e5f;
  --fondo: #f4f1e8;
  --papel: #ffffff;
  --tinta: #1d1d1d;
  --gris: #6b6b6b;
  --linea: #c9c3b3;
  --linea-fuerte: #3b3b3b;
  --sel: #bfe3cc;
  --vecina: #e6efe9;
  --igual: #cfe8d8;
  --mia: #1b5fa8;
  --rojo: #c0392b;
  --rojo-fondo: #f7d9d5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #14181a; --papel: #1e2427; --tinta: #eceae3; --gris: #9aa3a6;
    --linea: #3a4448; --linea-fuerte: #aab3b6; --sel: #2b5a40; --vecina: #263034;
    --igual: #2f4a3a; --mia: #7db6ee; --rojo: #ff8a7c; --rojo-fondo: #4a2824;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fondo); color: var(--tinta);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
[hidden] { display: none !important; }

#cabecera {
  display: flex; align-items: center; gap: 10px;
  background: var(--verde); color: #fff; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
}
#cabecera h1 {
  margin: 0; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400;
  letter-spacing: 1.5px; font-size: 26px; line-height: 1;
}
#volver { color: #fff; text-decoration: none; font-size: 30px; line-height: 1; padding: 0 8px 4px 0; }
#datos { margin-left: auto; display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
#nivel-actual { opacity: 0.9; font-weight: 600; }
#vidas { font-size: 16px; letter-spacing: 2px; }
#reloj { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; }

main { max-width: 760px; margin: 0 auto; padding: 12px 10px 18px; }

/* Menú */
#pantalla-menu { display: flex; flex-direction: column; gap: 12px; max-width: 460px; margin: 10px auto 0; }
.intro { color: var(--gris); margin: 4px 2px 6px; line-height: 1.4; }
.nivel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  background: var(--papel); color: var(--tinta); border: 1.5px solid var(--verde); border-radius: 12px;
  padding: 16px 18px; cursor: pointer; font: inherit;
}
.nivel:active { background: var(--verde); color: #fff; }
.nivel-nombre { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 28px; letter-spacing: 1px; color: var(--verde); }
.nivel:active .nivel-nombre { color: #fff; }
.nivel-desc { font-size: 14px; }
.nivel-stats { font-size: 12px; color: var(--gris); min-height: 1em; }
.nivel:active .nivel-stats { color: #e3f0e8; }
.enlace {
  background: none; border: none; color: var(--verde); font: inherit; font-size: 14px; font-weight: 600;
  padding: 10px; cursor: pointer; text-decoration: underline;
}
@media (prefers-color-scheme: dark) { .enlace { color: #7fd1a1; } .nivel-nombre { color: #7fd1a1; } }

/* Juego */
#pantalla-juego { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#tablero {
  --lado: min(calc(100vw - 20px), 470px);
  width: var(--lado); height: var(--lado);
  display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
  border: 2.5px solid var(--linea-fuerte); border-radius: 4px; background: var(--papel); overflow: hidden;
}
.c {
  position: relative; display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea);
  font-size: calc(var(--lado) / 15); font-weight: 600; cursor: pointer; background: var(--papel);
  color: var(--mia);
}
.c[data-c="2"], .c[data-c="5"] { border-right: 2px solid var(--linea-fuerte); }
.c[data-c="8"] { border-right: none; }
.c[data-f="2"], .c[data-f="5"] { border-bottom: 2px solid var(--linea-fuerte); }
.c[data-f="8"] { border-bottom: none; }
.c.dada { color: var(--tinta); font-weight: 700; }
.c.vecina { background: var(--vecina); }
.c.igual { background: var(--igual); }
.c.sel { background: var(--sel); box-shadow: inset 0 0 0 2px var(--verde); }
.c.conflicto { color: var(--rojo); background: var(--rojo-fondo); }
.c.mala { color: var(--rojo); background: var(--rojo-fondo); }
.c .notas {
  position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  font-size: calc(var(--lado) / 31); font-weight: 500; color: var(--gris); line-height: 1;
}
.c .notas i { font-style: normal; display: flex; align-items: center; justify-content: center; }

#mando { width: min(calc(100vw - 20px), 470px); display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
#herramientas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
#herramientas button {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px;
  background: var(--papel); color: var(--tinta); border: 1.5px solid var(--linea); border-radius: 10px;
  font: inherit; font-size: 12px; cursor: pointer;
}
#herramientas .ico { font-size: 20px; line-height: 1.1; }
#herramientas button:active { background: var(--vecina); }
#herramientas button[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
#herramientas button:disabled { opacity: 0.4; }
#teclado { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
#teclado button {
  position: relative; aspect-ratio: 3 / 4; padding: 0; background: var(--papel); color: var(--mia);
  border: 1.5px solid var(--linea); border-radius: 9px; font: inherit; font-size: 24px; font-weight: 600; cursor: pointer;
}
#teclado button small { position: absolute; right: 4px; bottom: 2px; font-size: 10px; color: var(--gris); font-weight: 500; }
#teclado button:active { background: var(--sel); }
#teclado button.hecho { opacity: 0.25; }
#btn-nueva { align-self: center; }

/* Avisos y diálogos */
#aviso {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; text-align: center;
}
#aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#capa { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
#capa-caja {
  background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 22px 20px 16px; width: min(92vw, 380px);
  text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
#capa-caja h2 { margin: 0 0 8px; font-family: 'Bebas Neue', 'Inter', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px; color: var(--verde); }
@media (prefers-color-scheme: dark) { #capa-caja h2 { color: #7fd1a1; } }
#capa-caja p { margin: 6px 0; line-height: 1.45; }
#capa-caja .datos { font-size: 15px; color: var(--gris); }
#capa-caja .botones { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
#capa-caja .botones button {
  padding: 12px; border-radius: 10px; border: 1.5px solid var(--verde); background: var(--papel); color: var(--verde);
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
}
#capa-caja .botones button.principal { background: var(--verde); color: #fff; }
@media (prefers-color-scheme: dark) { #capa-caja .botones button { color: #7fd1a1; border-color: #7fd1a1; } #capa-caja .botones button.principal { color: #fff; border-color: var(--verde); } }
.girando { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--linea); border-top-color: var(--verde); border-radius: 50%; animation: gira 0.8s linear infinite; margin: 6px 0 2px; }
@keyframes gira { to { transform: rotate(360deg); } }

/* Móvil apaisado / pantallas bajas: tablero a la izquierda, mando a la derecha */
@media (orientation: landscape) and (max-height: 620px) {
  main { padding: 6px 10px; }
  #cabecera { padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
  #pantalla-juego { flex-direction: row; justify-content: center; align-items: center; gap: 16px; }
  #tablero { --lado: min(calc(100svh - 70px), 470px); }
  #mando { width: min(300px, 42vw); gap: 8px; }
  #teclado { grid-template-columns: repeat(3, 1fr); }
  #teclado button { aspect-ratio: auto; height: 42px; font-size: 22px; }
}
</style>
</head>
<body>
<header id="cabecera">
  <a id="volver" href="aburres.html" aria-label="Volver a ¿Te aburres?">‹</a>
  <h1>Sudoku</h1>
  <div id="datos">
    <span id="nivel-actual"></span>
    <span id="vidas" aria-label="Fallos"></span>
    <span id="reloj" aria-label="Tiempo de juego">00:00</span>
  </div>
</header>

<main>
  <section id="pantalla-menu" hidden>
    <p class="intro">Elige nivel. Un número que no va en su casilla es un fallo: con tres fallos se acaba la partida. Se guarda sola: puedes dejarla y seguir más tarde.</p>
    <button class="nivel" data-nivel="normal">
      <span class="nivel-nombre">Normal</span>
      <span class="nivel-desc">Para un rato tranquilo</span>
      <span class="nivel-stats" id="stats-normal"></span>
    </button>
    <button class="nivel" data-nivel="anormal">
      <span class="nivel-nombre">Anormal</span>
      <span class="nivel-desc">Pares, tríos… te va a costar</span>
      <span class="nivel-stats" id="stats-anormal"></span>
    </button>
    <button id="btn-cancelar-menu" class="enlace" hidden>Volver a mi partida</button>
  </section>

  <section id="pantalla-juego" hidden>
    <div id="tablero" role="grid" aria-label="Tablero de sudoku"></div>
    <div id="mando">
      <div id="herramientas">
        <button id="btn-deshacer" aria-label="Deshacer"><span class="ico">↶</span><span>Deshacer</span></button>
        <button id="btn-borrar" aria-label="Borrar casilla"><span class="ico">⌫</span><span>Borrar</span></button>
        <button id="btn-notas" aria-pressed="false" aria-label="Modo notas"><span class="ico">✎</span><span>Notas</span></button>
        <button id="btn-pista" aria-label="Pista"><span class="ico">💡</span><span>Pista</span></button>
      </div>
      <div id="teclado" role="group" aria-label="Dígitos"></div>
      <button id="btn-nueva" class="enlace">Nueva partida</button>
    </div>
  </section>
</main>

<div id="aviso" role="status" aria-live="polite"></div>
<div id="capa" hidden><div id="capa-caja"></div></div>
<script>(() => {
  // sudoku/src/sudoku.js
  var NIVELES = {
    // Normal: se resuelve sin adivinar, con casillas únicas y, como mucho, candidatos bloqueados.
    normal: { nombre: "Normal", rangoMin: 2, rangoMax: 3, pistasMin: 29, pistasMax: 34 },
    // Anormal: hace falta algún par o trío (desnudo u oculto). Aun así no hay que adivinar.
    anormal: { nombre: "Anormal", rangoMin: 4, rangoMax: 4, pistasMin: 0, pistasMax: 0 }
  };
  var fila = (i) => i / 9 | 0;
  var columna = (i) => i % 9;
  var caja = (i) => (fila(i) / 3 | 0) * 3 + (columna(i) / 3 | 0);
  var UNIDADES = [];
  for (let r = 0; r < 9; r++) UNIDADES.push(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) UNIDADES.push(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let b = 0; b < 9; b++) {
    const f0 = (b / 3 | 0) * 3, c0 = b % 3 * 3, u = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) u.push((f0 + r) * 9 + c0 + c);
    UNIDADES.push(u);
  }
  var FILAS = UNIDADES.slice(0, 9);
  var COLUMNAS = UNIDADES.slice(9, 18);
  var CAJAS = UNIDADES.slice(18, 27);
  var UNIDADES_DE = Array.from({ length: 81 }, (_, i) => [FILAS[fila(i)], COLUMNAS[columna(i)], CAJAS[caja(i)]]);
  var VECINAS = Array.from({ length: 81 }, (_, i) => {
    const s = /* @__PURE__ */ new Set();
    for (const u of UNIDADES_DE[i]) for (const c of u) if (c !== i) s.add(c);
    return [...s];
  });
  var BIT = (d) => 1 << d - 1;
  var CUENTA = new Uint8Array(512);
  for (let m = 1; m < 512; m++) CUENTA[m] = CUENTA[m >> 1] + (m & 1);
  var TODOS = 511;
  function barajar(arr, azar) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(azar() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function aArray(cuad) {
    if (typeof cuad === "string") return Array.from(cuad, (ch) => ch.charCodeAt(0) - 48);
    return Array.from(cuad);
  }
  function aCadena(cuad) {
    return Array.from(cuad, (d) => String.fromCharCode(48 + d)).join("");
  }
  function contarSoluciones(cuad, limite = 2, azar = null) {
    const v = aArray(cuad);
    const f = new Array(9).fill(0), c = new Array(9).fill(0), b = new Array(9).fill(0);
    let vacias = 0;
    for (let i = 0; i < 81; i++) {
      if (v[i]) {
        const m = BIT(v[i]);
        if (f[fila(i)] & m || c[columna(i)] & m || b[caja(i)] & m) return { cuenta: 0, solucion: null };

        c[columna(i)] |= m;
        b[caja(i)] |= m;
      } else vacias++;
    }
    let cuenta = 0, primera = null;
    function rec(restantes) {
      if (restantes === 0) {
        cuenta++;
        if (!primera) primera = v.slice();
        return cuenta >= limite;
      }
      let mejor = -1, mejorMask = 0, mejorN = 10;
      for (let i = 0; i < 81; i++) {
        if (v[i]) continue;
        const libres = TODOS & ~(f[fila(i)] | c[columna(i)] | b[caja(i)]);
        const n = CUENTA[libres];
        if (n < mejorN) {
          mejorN = n;
          mejor = i;
          mejorMask = libres;
          if (n <= 1) break;
        }
      }
      if (mejorN === 0) return false;
      const digs = [];
      for (let d = 1; d <= 9; d++) if (mejorMask & BIT(d)) digs.push(d);
      if (azar) barajar(digs, azar);
      for (const d of digs) {
        const m = BIT(d);
        v[mejor] = d;
        f[fila(mejor)] |= m;
        c[columna(mejor)] |= m;
        b[caja(mejor)] |= m;
        const fin = rec(restantes - 1);
        v[mejor] = 0;
        f[fila(mejor)] &= ~m;
        c[columna(mejor)] &= ~m;
        b[caja(mejor)] &= ~m;
        if (fin) return true;
      }
      return false;
    }
    rec(vacias);
    return { cuenta, solucion: primera };
  }
  function generarSolucion(azar = Math.random) {
    return contarSoluciones(new Array(81).fill(0), 1, azar).solucion;
  }
  function conflictos(cuad) {
    const v = aArray(cuad);
    const malas = /* @__PURE__ */ new Set();
    for (const u of UNIDADES) {
      const vistos = /* @__PURE__ */ new Map();
      for (const i of u) {
        if (!v[i]) continue;
        if (vistos.has(v[i])) {
          malas.add(i);
          malas.add(vistos.get(v[i]));
        } else vistos.set(v[i], i);
      }
    }
    return malas;
  }
  function resolverConTecnicas(cuad, { solucion = null } = {}) {
    const val = aArray(cuad);
    const sol = solucion ? aArray(solucion) : null;
    const cand = new Array(81).fill(0);
    let vacias = 0;
    for (let i = 0; i < 81; i++) {
      if (val[i]) continue;
      vacias++;
      let m = TODOS;
      for (const p of VECINAS[i]) if (val[p]) m &= ~BIT(val[p]);
      cand[i] = m;
    }
    const usadas = /* @__PURE__ */ new Set();
    function colocar(i, d) {
      if (sol && sol[i] !== d) throw new Error(`Técnica incorrecta: pone ${d} en ${i}, debía ser ${sol[i]}`);

      cand[i] = 0;
      vacias--;
      const m = ~BIT(d);
      for (const p of VECINAS[i]) cand[p] &= m;
    }
    function quitar(i, mascara) {
      const antes = cand[i], nuevo = antes & ~mascara;
      if (nuevo === antes) return false;
      if (sol && (nuevo & BIT(sol[i])) === 0 && antes & BIT(sol[i])) {
        throw new Error(`Técnica incorrecta: elimina ${sol[i]} de la casilla ${i}`);
      }
      cand[i] = nuevo;
      return true;
    }
    function casillaUnica() {
      let hecho = false;
      for (let i = 0; i < 81; i++) {
        if (!val[i] && CUENTA[cand[i]] === 1) {
          colocar(i, Math.log2(cand[i]) + 1);
          hecho = true;
        }
      }
      return hecho;
    }
    function casillaOculta() {
      let hecho = false;
      for (const u of UNIDADES) {
        for (let d = 1; d <= 9; d++) {
          const m = BIT(d);
          let donde = -1, n = 0;
          for (const i of u) {
            if (!val[i] && cand[i] & m) {
              n++;
              donde = i;
            }
          }
          if (n === 1) {
            colocar(donde, d);
            hecho = true;
          }
        }
      }
      return hecho;
    }
    function bloqueados() {
      let hecho = false;
      for (const cajaU of CAJAS) {
        for (let d = 1; d <= 9; d++) {
          const m = BIT(d);
          const lugares = cajaU.filter((i) => !val[i] && cand[i] & m);
          if (lugares.length < 2) continue;
          for (const linea of [fila, columna]) {
            if (lugares.every((i) => linea(i) === linea(lugares[0]))) {
              const U = linea === fila ? FILAS[fila(lugares[0])] : COLUMNAS[columna(lugares[0])];
              for (const j of U) {
                if (caja(j) !== caja(lugares[0]) && !val[j] && quitar(j, m)) hecho = true;
              }
            }
          }
        }
      }
      for (const linea of [...FILAS, ...COLUMNAS]) {
        for (let d = 1; d <= 9; d++) {
          const m = BIT(d);
          const lugares = linea.filter((i) => !val[i] && cand[i] & m);
          if (lugares.length < 2) continue;
          if (lugares.every((i) => caja(i) === caja(lugares[0]))) {
            for (const j of CAJAS[caja(lugares[0])]) {

      return hecho;
    }
    function combinaciones(n, k, fn) {
      const idx = [];
      (function rec(desde) {
        if (idx.length === k) {
          fn(idx.slice());
          return;

        for (let x = desde; x < n; x++) {
          idx.push(x);
          rec(x + 1);
          idx.pop();

    function subconjuntos() {

      for (const u of UNIDADES) {

      [2, casillaOculta],

      [4, subconjuntos]

          usadas.add(r);
          avanzo = true;
          break;
        }

      ev.preventDefault();
    }
  });
  construirTablero();
  $("btn-deshacer").addEventListener("click", pulsarDeshacer);
  $("btn-borrar").addEventListener("click", pulsarBorrar);
  $("btn-notas").addEventListener("click", alternarModoNotas);
  $("btn-pista").addEventListener("click", pulsarPista);
  $("btn-nueva").addEventListener("click", pedirNueva);
  $("btn-cancelar-menu").addEventListener("click", mostrarJuego);
  for (const b of document.querySelectorAll(".nivel")) b.addEventListener("click", () => empezar(b.dataset.nivel));
  var guardada = leer(CLAVE_PARTIDA) ? deserializar(leer(CLAVE_PARTIDA)) : null;
  if (guardada) {
    e = guardada;
    mostrarJuego();
    aviso("Sigues donde lo dejaste");
  } else {
    if (leer(CLAVE_PARTIDA)) borrarClave(CLAVE_PARTIDA);
    mostrarMenu(false);
  }
  window.__sudoku = { estado: () => e, seleccionar, pulsarDigito };
})();
</script>
